<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Great Wave</title>
<meta name="description" content="An ukiyo-e woodblock homage to Hokusai's Great Wave: today's tokens raise the breaking wave and its spray, recent days roll in as swells, and each model rows a boat in the trough.">
<style>
:root{
  --paper:#eee2c6; --paper2:#e4d4b0; --ink:#1d1b22; --prussian:#1b365d; --indigo:#2a4a78;
  --blue:#5f88b0; --pale:#a9c2d3; --foam:#f6f0e0; --red:#b4362c; --red2:#8f2620; --brown:#6b4a2c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif CJK JP","Noto Serif JP","Iowan Old Style","Palatino Linotype",Georgia,serif;overflow-x:hidden}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;height:100vh;padding:22px}
.print{position:relative;min-height:0;border:3px solid var(--ink);box-shadow:0 0 0 6px var(--paper),0 0 0 7px rgba(29,27,34,.45),6px 8px 0 7px rgba(60,40,20,.12)}
.print canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cart{position:absolute;top:16px;right:16px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.cartouche{background:var(--red);border:2px solid var(--ink);outline:2px solid var(--red);outline-offset:-7px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:2px 3px 0 rgba(29,27,34,.25)}
.cartouche .ttl{writing-mode:vertical-rl;font-size:12px;letter-spacing:.32em;color:var(--foam);font-weight:700;margin-bottom:8px}
.cartouche .jp{font-size:15px;color:var(--foam);margin-bottom:6px;line-height:1.05;text-align:center}
.digits{display:flex;flex-direction:column;align-items:center;color:var(--foam);font-weight:700;font-variant-numeric:tabular-nums}
.digits span{display:block;font-size:var(--dg,27px);line-height:1.02;height:1.02em;text-shadow:1px 1px 0 var(--red2)}
.digits i{display:block;width:5px;height:5px;border-radius:50%;background:var(--foam);margin:3px 0 4px;opacity:.85}
.side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.sig{background:var(--paper);border:1.5px solid var(--ink);padding:8px 5px;writing-mode:vertical-rl;font-size:11px;letter-spacing:.14em;color:var(--ink)}
.seal{width:74px;height:74px;background:var(--red);border:2px solid var(--red2);border-radius:6px;color:var(--foam);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-4deg);box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4.5px rgba(246,240,224,.8);text-align:center}
.seal b{font-size:17px;line-height:1}
.seal small{font-size:9px;letter-spacing:.18em;margin-top:4px}
.panel{position:relative;overflow:auto;border:3px solid var(--ink);background:var(--paper2);padding:18px 18px 14px;box-shadow:inset 0 0 0 5px var(--paper2),inset 0 0 0 6.5px rgba(29,27,34,.55)}
.panel h1{margin:2px 0 0;font-size:26px;letter-spacing:.06em;font-weight:700;display:flex;align-items:baseline;gap:10px}
.panel h1 em{font-style:normal;color:var(--red);font-size:20px}
.sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:12px}
.sec{border-top:1.5px solid var(--ink);padding-top:8px;margin-top:9px}
.sec h2{margin:0 0 7px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--red2);display:flex;justify-content:space-between}
.sec h2 span{color:var(--ink);opacity:.6;letter-spacing:.1em}
.today{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.today b{font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.today small{font-size:12px;opacity:.75;text-align:right}
.fleet{display:grid;grid-template-columns:34px 1fr auto;gap:0 8px;align-items:center;font-size:13px}
.fleet .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fleet .am{font-variant-numeric:tabular-nums;text-align:right}
.fleet .am small{opacity:.6;margin-left:5px;font-size:11px}
.fleet .bar{grid-column:2/4;height:2px;background:rgba(29,27,34,.12);margin:-2px 0 3px}
.fleet .bar i{display:block;height:100%}
.split{height:16px;display:flex;border:1.5px solid var(--ink);margin-bottom:6px;background:var(--paper)}
.split .m{background:var(--prussian)}
.split .e{background:repeating-linear-gradient(-45deg,var(--blue) 0 3px,var(--paper) 3px 6px)}
.splitl{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums}
.splitl i{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px}
.tide{width:100%;height:80px;display:block}
.tidel{display:flex;justify-content:space-between;font-size:11px;opacity:.7}
.foot{font-size:10.5px;opacity:.6;margin-top:10px;letter-spacing:.05em}
.tip{position:fixed;pointer-events:none;background:var(--paper);border:1.5px solid var(--ink);padding:6px 9px;font-size:12px;box-shadow:3px 3px 0 rgba(29,27,34,.25);opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap}
.tip b{color:var(--red2)}
.demo{color:var(--red);font-weight:700}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;height:auto;padding:14px;gap:18px}
  .print{height:min(118vw,640px)}
  .cart{top:10px;right:10px;gap:6px}
  .cartouche{padding:9px 6px}
  .digits span{--dg:19px}
  .seal{width:58px;height:58px}.seal b{font-size:13px}
  .sig{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="print" id="print">
    <canvas id="cv"></canvas>
    <div class="cart">
      <div class="side">
        <div class="seal" title="Tokens today"><b id="sealv">0</b><small>TODAY</small></div>
        <div class="sig" id="sig">measured · estimated</div>
      </div>
      <div class="cartouche" title="All tokens burned">
        <div class="jp">浪</div>
        <div class="ttl">TOKEN BURN</div>
        <div class="digits" id="digits"></div>
      </div>
    </div>
  </div>
  <aside class="panel">
    <h1>Token Burn <em>浪裏</em></h1>
    <div class="sub">Under the wave of tokens</div>
    <div class="sec">
      <h2>Today <span id="dayname"></span></h2>
      <div class="today"><b id="todayv">0</b><small>this week<br><span id="weekv">0</span></small></div>
    </div>
    <div class="sec">
      <h2>The fleet <span>by model</span></h2>
      <div class="fleet" id="fleet"></div>
    </div>
    <div class="sec">
      <h2>Counted <span>measured / estimated</span></h2>
      <div class="split"><div class="m" id="sm"></div><div class="e" id="se"></div></div>
      <div class="splitl"><span><i style="background:var(--prussian)"></i><span id="mv"></span></span><span><i style="background:repeating-linear-gradient(-45deg,var(--blue) 0 2px,var(--paper) 2px 4px)"></i><span id="ev"></span></span></div>
    </div>
    <div class="sec">
      <h2>Tide record <span id="ndays"></span></h2>
      <svg class="tide" id="tide" preserveAspectRatio="none"></svg>
      <div class="tidel"><span id="d0"></span><span id="d1"></span></div>
    </div>
    <div class="foot" id="foot"></div>
  </aside>
</div>
<div class="tip" id="tip"></div>
<script src="tb-data.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), print = $("print");
const C = {ink:"#1d1b22",prus:"#1b365d",deep:"#142a4a",indigo:"#2a4a78",blue:"#5f88b0",pale:"#a9c2d3",foam:"#f6f0e0",paper:"#eee2c6",red:"#b4362c",sky:"#e6d8b8"};
let W = 0, H = 0, dpr = 1, D = null, shown = 0, target = 0, todayShown = 0;
let intensity = .5, intenS = .5, surge = 0, lastToday = null, milestone = 0;
const parts = [];

/* ---------- colour helpers: model colours pressed through woodblock pigment ---------- */
function hex(h){h=h.replace("#","");if(h.length==3)h=h.split("").map(c=>c+c).join("");return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}
const pig = c => mix(c,"#c9b48a",.28);
const pigDark = c => mix(c,"#1d1b22",.35);

/* ---------- washi texture (generated once) ---------- */
function makeGrain(){
  const g=document.createElement("canvas");g.width=g.height=320;const x=g.getContext("2d");
  let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<5200;i++){x.fillStyle=`rgba(${80+r()*40|0},${55+r()*30|0},${30|0},${.03+r()*.07})`;x.fillRect(r()*320,r()*320,1+r()*1.4,1+r()*1.4)}
  for(let i=0;i<520;i++){x.strokeStyle=`rgba(${r()<.5?"110,85,50":"255,250,235"},${.05+r()*.09})`;x.lineWidth=.6+r()*.7;x.beginPath();const a=r()*6.28,l=5+r()*22,px=r()*320,py=r()*320;x.moveTo(px,py);x.quadraticCurveTo(px+Math.cos(a+.6)*l*.5,py+Math.sin(a+.6)*l*.5,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}
  return g;
}
const grain = makeGrain();
let grainPat = null;
document.body.style.backgroundImage = `url(${grain.toDataURL()})`;
document.querySelector(".panel").style.backgroundImage = `url(${grain.toDataURL()})`;

function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = print.clientWidth; H = print.clientHeight;
  cv.width = W*dpr|0; cv.height = H*dpr|0;
  grainPat = ctx.createPattern(grain,"repeat");
  const dg = Math.max(15, Math.min(28, (H-200)/16.5));
  $("digits").style.setProperty("--dg", dg+"px");
}
addEventListener("resize", resize);

/* ---------- geometry ---------- */
function bez(p0,p1,p2,p3,n,out){for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]])}return out}
function poly(pts,close){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath()}

/* a breaking wave: back slope + spiral lip curling to the right */
function waveShape(o){
  const {x0,base,cx,cy,R,a1,shrink,th0,face} = o, ex = o.ex||1, a0 = Math.PI, N = 70;
  const sp = [];  // spiral samples {x,y,a,r,t,th}
  for(let i=0;i<=N;i++){const t=i/N,a=a0+(a1-a0)*t,r=R*(1-shrink*t),th=R*th0*Math.pow(1-t,.85)+R*.015;sp.push({x:cx+r*Math.cos(a)*ex,y:cy+r*Math.sin(a),a,r,t,th})}
  const back = bez([x0,base],[cx-R*1.9,base-R*.15],[cx-R*1.08,cy+R*1.05],[sp[0].x,sp[0].y],26,[]);
  const outer = back.concat(sp.map(p=>[p.x,p.y]));
  const inner = [];
  const tf = .13;
  for(let i=N;i>=0;i--){const p=sp[i];if(p.t<tf)break;const r=p.r-p.th;inner.push([cx+r*Math.cos(p.a)*ex,cy+r*Math.sin(p.a)])}
  const ip = inner[inner.length-1];
  bez(ip,[cx-R*(.85),cy+R*.45],[cx-R*(.45),base-R*.45],[cx+R*face,base],22,inner);
  const body = outer.concat(inner,[[cx+R*face,base+R*2],[x0,base+R*2]]);
  return {sp,outer,inner,body,back,o};
}

function drawWave(w, t, big){
  const {sp,o} = w, R=o.R;
  // body
  ctx.save();
  poly(w.body,true); ctx.fillStyle=C.prus; ctx.fill();
  ctx.clip();
  // inner layered bands: nested copies of the outer contour, pulled toward the base
  const px=o.cx-R*.4, py=o.base+R*.3;
  for(let k=1;k<=9;k++){
    const s=1-k*.075;
    ctx.save();ctx.translate(px,py);ctx.scale(s,s*(1-k*.004));ctx.translate(-px,-py);
    poly(w.outer,false);
    ctx.lineWidth=(k%3==0?R*.05:R*.022)/s; ctx.strokeStyle=k%3==0?C.indigo:(k%2?C.blue:"#3d6694");ctx.stroke();
    ctx.restore();
  }
  // vertical darker ribs on the face
  ctx.globalAlpha=.55;ctx.strokeStyle=C.deep;ctx.lineWidth=R*.012;
  for(let k=0;k<14;k++){const x=o.cx-R*1.6+k*R*.17;ctx.beginPath();ctx.moveTo(x,o.base);ctx.quadraticCurveTo(x+R*.15,o.base-R*.9,x+R*.55+Math.sin(t*.6+k)*R*.03,o.base-R*1.9);ctx.stroke()}
  ctx.globalAlpha=1;
  ctx.restore();
  // foam band along the lip
  const fs = sp.filter(p=>p.t>.16);
  const fo = fs.map(p=>[p.x,p.y]);
  const fi = fs.slice().reverse().map(p=>{const r=p.r-p.th*.42;return [o.cx+r*Math.cos(p.a)*(o.ex||1),o.cy+r*Math.sin(p.a)]});
  poly(fo.concat(fi),true);ctx.fillStyle=C.foam;ctx.fill();
  // lacy scallops along the inner edge of the foam
  ctx.fillStyle=C.foam;ctx.strokeStyle=C.prus;ctx.lineWidth=1.1;
  for(let i=0;i<fi.length;i+=2){const [x,y]=fi[i];const rr=R*.019*(1+.4*Math.sin(i*1.7+t*2));ctx.beginPath();ctx.arc(x,y,rr,0,6.283);ctx.fill();ctx.stroke()}
  poly(fo.concat(fi),true);ctx.lineWidth=Math.max(1.2,R*.012);ctx.strokeStyle=C.ink;ctx.stroke();
  // outline of whole wave
  poly(w.outer,false);ctx.lineWidth=Math.max(1.5,R*.016);ctx.strokeStyle=C.ink;ctx.stroke();
  poly(w.inner,false);ctx.stroke();
  // claws
  const nc = big ? Math.round(9+intenS*7) : 6;
  for(let k=0;k<nc;k++){
    const tt=.3+.66*k/(nc-1);
    const i=Math.min(sp.length-1,Math.round(tt*(sp.length-1))), p=sp[i];
    const n=[Math.cos(p.a),Math.sin(p.a)], f=[-Math.sin(p.a),Math.cos(p.a)];
    const L=R*(big?.27:.3)*(1-.4*tt)*(1+.12*Math.sin(t*2.2+k*1.3))*(.75+.5*intenS);
    const fingers = 3+(k%2);
    for(let j=0;j<fingers;j++){
      const sp2=(j-(fingers-1)/2)*.42;
      const d=[n[0]*Math.cos(sp2)-n[1]*Math.sin(sp2), n[0]*Math.sin(sp2)+n[1]*Math.cos(sp2)];
      const lj=L*(1-.18*Math.abs(j-(fingers-1)/2));
      claw(p.x,p.y,d,f,lj,t+k+j);
    }
  }
}
function claw(x,y,d,f,L,ph){
  // tapered hook: out along d, then curling forward (f) and back in
  const pts=[],m=9;
  for(let i=0;i<=m;i++){const s=i/m;const cu=.9*s*s,hk=s>.55?(s-.55)*(s-.55)*2.2:0;
    pts.push([x+d[0]*L*s+f[0]*L*cu-d[0]*L*hk, y+d[1]*L*s+f[1]*L*cu-d[1]*L*hk])}
  const lft=[],rgt=[];
  for(let i=0;i<=m;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(m,i+1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;const w=L*.16*(1-i/m)+.6;lft.push([pts[i][0]+nx*w,pts[i][1]+ny*w]);rgt.push([pts[i][0]-nx*w,pts[i][1]-ny*w])}
  poly(lft.concat(rgt.reverse()),true);ctx.fillStyle=C.foam;ctx.fill();ctx.lineWidth=1.1;ctx.strokeStyle=C.ink;ctx.stroke();
}

/* ---------- scene pieces ---------- */
function seaY(x,t,base){return base+H*.009*Math.sin(x*.016-t*.9)+H*.006*Math.sin(x*.043+t*1.4)}
function drawSky(t){
  const hz=H*.6;
  const g=ctx.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,"#57524c");g.addColorStop(.16,"#a69b87");g.addColorStop(.32,C.sky);g.addColorStop(1,"#eadfc5");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
  // stylised flat clouds drifting
  ctx.fillStyle="rgba(246,240,224,.55)";
  for(let i=0;i<3;i++){const x=((i*.37+t*.004)%1.2-.1)*W,y=H*(.14+i*.07);
    ctx.beginPath();ctx.ellipse(x,y,W*.13,H*.012,0,0,6.283);ctx.ellipse(x+W*.06,y-H*.01,W*.07,H*.01,0,0,6.283);ctx.fill()}
}
function drawFuji(){
  const hz=H*.6,cx=W*.66,w=W*.17,h=H*.085;
  ctx.beginPath();ctx.moveTo(cx-w,hz+2);ctx.quadraticCurveTo(cx-w*.35,hz-h*.55,cx-w*.12,hz-h);ctx.lineTo(cx+w*.1,hz-h);ctx.quadraticCurveTo(cx+w*.35,hz-h*.55,cx+w,hz+2);ctx.closePath();
  ctx.fillStyle="#6d7f93";ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle=C.ink;ctx.stroke();
  // snow cap with jagged melt edge
  ctx.beginPath();ctx.moveTo(cx-w*.12,hz-h);ctx.lineTo(cx+w*.1,hz-h);
  const sx=cx+w*.1,ex=cx-w*.12;let cnt=7;
  ctx.quadraticCurveTo(cx+w*.2,hz-h*.78,cx+w*.26,hz-h*.58);
  for(let i=0;i<=cnt;i++){const u=i/cnt,x=cx+w*.26-u*w*.56,y=hz-h*(.58+(i%2?.14:0)+.06*Math.sin(i*2.1));ctx.lineTo(x,y)}
  ctx.quadraticCurveTo(cx-w*.22,hz-h*.8,ex,hz-h);ctx.closePath();
  ctx.fillStyle=C.foam;ctx.fill();ctx.lineWidth=1.1;ctx.stroke();
}
function drawFarSea(t){
  const hz=H*.6;
  ctx.fillStyle="#9db8c9";ctx.fillRect(0,hz,W,H-hz);
  ctx.strokeStyle="rgba(42,74,120,.35)";ctx.lineWidth=1;
  for(let k=1;k<9;k++){const y=hz+k*k*H*.0028;ctx.beginPath();for(let x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*.05+k+t*.5)*1.2);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,hz);ctx.lineTo(W,hz);ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.stroke();
}
let swellHits=[], boatHits=[];
function drawSwells(t){
  swellHits=[];
  if(!D||!D.days.length)return;
  const n=Math.max(1,Math.min(D.days.length, W<500?8:14)), days=D.days.slice(-n);
  const x0=W*.37,x1=W*.99,sp=(x1-x0)/n, by=H*.745;
  const mx=Math.max(...days.map(d=>d.tokens),1);
  days.forEach((d,i)=>{
    const cx=x0+sp*(i+.5)+Math.sin(t*.4+i)*sp*.05;
    const v=Math.pow(d.tokens/D.maxDay,.7), h=H*.01+H*.16*v, w=sp*.75+h*.5;
    const isT=d.d===D.todayISO;
    const bob=Math.sin(t*1.1+i*.8)*H*.004*(1+intenS);
    const top=by-h+bob;
    ctx.beginPath();ctx.moveTo(cx-w,by+H*.03);
    ctx.bezierCurveTo(cx-w*.55,by,cx-w*.3,top,cx+w*.06,top);
    ctx.bezierCurveTo(cx+w*.3,top,cx+w*.35,top+h*.3,cx+w*.5,by+H*.03);ctx.closePath();
    ctx.fillStyle=i%2?C.prus:"#22426e";ctx.fill();
    ctx.save();ctx.clip();ctx.strokeStyle=C.blue;ctx.lineWidth=1;
    for(let k=1;k<5;k++){ctx.beginPath();ctx.moveTo(cx-w,by+H*.03);ctx.bezierCurveTo(cx-w*.55,by+k*4,cx-w*.3,top+k*h*.18,cx+w*.06,top+k*h*.18);ctx.bezierCurveTo(cx+w*.3,top+k*h*.18,cx+w*.35,top+h*.4,cx+w*.5,by+H*.03);ctx.stroke()}
    ctx.restore();
    ctx.lineWidth=1.2;ctx.strokeStyle=C.ink;ctx.stroke();
    // foam lip on the crest, curling forward
    if(h>H*.03){ctx.beginPath();ctx.moveTo(cx-w*.25,top+h*.12);ctx.quadraticCurveTo(cx+w*.05,top-h*.08,cx+w*.2,top+h*.12);ctx.quadraticCurveTo(cx+w*.05,top+h*.02,cx-w*.25,top+h*.12);ctx.fillStyle=C.foam;ctx.fill();ctx.lineWidth=1;ctx.stroke();
      for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(cx+w*(.12+j*.05),top+h*(.16+j*.06),1.4+h*.012,0,6.283);ctx.fillStyle=C.foam;ctx.fill();ctx.stroke()}}
    if(isT){ctx.fillStyle=C.red;ctx.fillRect(cx-4,top-H*.035,8,H*.02);ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.strokeRect(cx-4,top-H*.035,8,H*.02)}
    swellHits.push({x:cx-sp/2,x2:cx+sp/2,y:top-20,y2:by+10,d});
  });
}
function drawBoat(b,x,y,ang,t){
  const L=b.L,h=L*.085;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  // sail
  const mx=-L*.05,mh=L*.42,sw=L*.2;
  ctx.beginPath();ctx.moveTo(mx,-h*.2);ctx.lineTo(mx,-h*.2-mh);ctx.lineWidth=Math.max(1,L*.012);ctx.strokeStyle=C.ink;ctx.stroke();
  const fl=Math.sin(t*1.7+b.i)*L*.02;
  ctx.beginPath();ctx.moveTo(mx+1,-h*.2-mh);ctx.quadraticCurveTo(mx+sw*.55,-h*.2-mh*.95+fl,mx+sw,-h*.2-mh*.98);ctx.lineTo(mx+sw+fl*.6,-h*.2-mh*.32);ctx.quadraticCurveTo(mx+sw*.5,-h*.2-mh*.28+fl,mx+1,-h*.2-mh*.3);ctx.closePath();
  ctx.fillStyle=b.pig;ctx.fill();ctx.lineWidth=1.1;ctx.stroke();
  ctx.save();ctx.clip();ctx.strokeStyle=b.dark;ctx.lineWidth=1;for(let k=1;k<3;k++){ctx.beginPath();ctx.moveTo(mx+sw*k/3,-h*.2-mh);ctx.lineTo(mx+sw*k/3,-h*.2-mh*.3);ctx.stroke()}ctx.restore();
  // rowers' hats
  const nr=Math.max(3,Math.min(9,Math.round(L/20)));
  for(let k=0;k<nr;k++){const rx=-L*.36+k*(L*.62/(nr-1));ctx.beginPath();ctx.ellipse(rx,-h*.55,L*.022+1.5,L*.012+1,0,0,6.283);ctx.fillStyle=C.foam;ctx.fill();ctx.lineWidth=.9;ctx.stroke()}
  // hull
  ctx.beginPath();ctx.moveTo(-L*.5,-h*.45);ctx.quadraticCurveTo(0,-h*.05,L*.5,-h*1.35);ctx.lineTo(L*.46,-h*.7);ctx.quadraticCurveTo(L*.1,h*.85,-L*.48,h*.15);ctx.closePath();
  ctx.fillStyle=b.pig;ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle=C.ink;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-L*.49,-h*.2);ctx.quadraticCurveTo(0,h*.3,L*.47,-h*.95);ctx.strokeStyle=b.dark;ctx.lineWidth=Math.max(1,h*.22);ctx.stroke();
  ctx.restore();
}
function boatLayout(){
  if(!D)return [];
  const ms=D.models.slice(0,10);
  const front=[.55,.74,.9], back=[.42,.5,.58,.66,.8,.88,.96];
  return ms.map((m,i)=>{
    const f=i<3, L=W*(f?.055+.13*Math.sqrt(m.share):.045+.09*Math.sqrt(m.share)) * (W<500?1.2:1);
    return {i,m,L,f,xr:f?front[i]:back[i-3],pig:pig(m.color),dark:pigDark(m.color)};
  });
}
function drawBoats(t,front,base){
  for(const b of boatLayout()){
    if(b.f!==front)continue;
    const x=b.xr*W + Math.sin(t*.3+b.i)*W*.01;
    let y,ang;
    if(front){y=seaY(x,t,base)+b.L*.02;ang=Math.atan2(seaY(x+6,t,base)-seaY(x-6,t,base),12)}
    else{y=H*.772+(b.i%2)*H*.01+Math.sin(t*1.2+b.i)*H*.004;ang=Math.sin(t*.9+b.i)*.05}
    drawBoat(b,x,y,ang,t);
    if(front){ctx.font=`${front?12:10}px "Noto Serif CJK JP",Georgia,serif`;ctx.textAlign="center";
    ctx.lineWidth=3;ctx.strokeStyle="rgba(27,54,93,.9)";ctx.strokeText(b.m.name,x,y+b.L*.11+12);ctx.fillStyle=C.foam;ctx.fillText(b.m.name,x,y+b.L*.11+12);
    }
    boatHits.push({x:x-b.L/2,x2:x+b.L/2,y:y-b.L*.5,y2:y+b.L*.1+14,m:b.m});
  }
}
function drawForeSea(t,base){
  ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8)ctx.lineTo(x,seaY(x,t,base));ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle=C.prus;ctx.fill();
  ctx.save();ctx.clip();
  for(let k=1;k<12;k++){ctx.beginPath();for(let x=0;x<=W;x+=10)ctx.lineTo(x,seaY(x,t-k*.25,base)+k*H*.016+Math.sin(x*.03+k)*2);ctx.strokeStyle=k%3?C.indigo:C.blue;ctx.lineWidth=k%3?1.4:2;ctx.stroke()}
  ctx.restore();
  ctx.beginPath();for(let x=0;x<=W;x+=8)ctx.lineTo(x,seaY(x,t,base));ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();
  // foam flecks on the surface
  ctx.fillStyle=C.foam;ctx.strokeStyle=C.ink;ctx.lineWidth=.8;
  for(let i=0;i<28;i++){const x=((i*97.3+t*12)%W),y=seaY(x,t,base)-1;ctx.beginPath();ctx.arc(x,y,1.3+(i%3),0,6.283);ctx.fill();ctx.stroke()}
}
function emitSpray(w,n,t){
  const sp=w.sp;
  for(let k=0;k<n&&parts.length<280;k++){
    const tt=.4+Math.random()*.6,p=sp[Math.round(tt*(sp.length-1))];
    const nn=[Math.cos(p.a),Math.sin(p.a)],f=[-Math.sin(p.a),Math.cos(p.a)];
    const s=H*(.05+Math.random()*.12)*(.6+intenS), fw=H*(.04+Math.random()*.1);
    parts.push({x:p.x+nn[0]*4,y:p.y+nn[1]*4,vx:nn[0]*s+f[0]*fw+H*.03,vy:nn[1]*s+f[1]*fw-H*.06,r:1+Math.random()*2.6*(H/700),life:0,max:1.6+Math.random()*1.8});
  }
}
function drawSpray(dt){
  ctx.fillStyle=C.foam;ctx.strokeStyle=C.prus;ctx.lineWidth=.8;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.vy+=H*.16*dt;p.vx*=.995;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life>p.max||p.y>H){parts.splice(i,1);continue}
    ctx.globalAlpha=Math.min(1,(p.max-p.life)*2);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.stroke()}
  ctx.globalAlpha=1;
}

/* ---------- frame ---------- */
let last=performance.now(), raf=0, sprayAcc=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  intenS+=(intensity-intenS)*Math.min(1,dt*.8);
  surge=Math.max(0,surge-dt*.35);
  // counters
  shown+=(target-shown)*Math.min(1,dt*2.2); if(Math.abs(target-shown)<1)shown=target;
  if(D){todayShown+=(D.today-todayShown)*Math.min(1,dt*2.2);setDigits(shown);$("sealv").textContent=TB.fmt(todayShown);$("todayv").textContent=TB.full(todayShown);
    const m=Math.floor(shown/1e8); if(milestone&&m>milestone){surge=1;sprayAcc+=120} milestone=m;}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  boatHits=[];
  drawSky(t);drawFuji();drawFarSea(t);drawSwells(t);
  drawBoats(t,false);
  const base=H*.82;
  const e=.5+.5*intenS+.12*surge;
  const R=H*(.13+.15*e)*(1+.015*Math.sin(t*.7)), cx=W*.27+Math.sin(t*.45)*W*.008;
  const big=waveShape({x0:-W*.05,base,cx,cy:base-R*1.75,R,a1:Math.PI*(2.5+.03*Math.sin(t*.9)),shrink:.42,th0:.62,face:.1,ex:1.38});
  drawWave(big,t,true);
  drawForeSea(t,base);
  // small foreground wave echoing the mountain
  const r2=H*.052*(1+.06*Math.sin(t*1.1+1));
  const sm=waveShape({x0:W*.2,base:H*1.0,cx:W*.36+Math.sin(t*.6)*W*.01,cy:H*1.0-r2*1.75,R:r2,a1:Math.PI*2.45,shrink:.45,th0:.55,face:.2,ex:1.3});
  drawWave(sm,t,false);
  drawBoats(t,true,base);
  sprayAcc+=dt*(25+120*intenS*intenS+160*surge);
  const ne=sprayAcc|0;sprayAcc-=ne;emitSpray(big,ne,t);if(Math.random()<dt*2)emitSpray(sm,2,t);
  drawSpray(dt);
  // washi grain over everything
  ctx.globalAlpha=.9;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else{last=performance.now();raf=requestAnimationFrame(frame)}});

/* ---------- DOM: cartouche + legend ---------- */
let lastDigitStr="";
function setDigits(v){
  const s=TB.full(v);if(s===lastDigitStr)return;
  const el=$("digits");
  if(s.length!==lastDigitStr.length){el.innerHTML=s.split("").map(c=>c===","?"<i></i>":"<span></span>").join("")}
  const spans=el.querySelectorAll("span");let j=0;for(const c of s)if(c!==",")spans[j++].textContent=c;
  lastDigitStr=s;
}
function boatSvg(c){const p=pig(c),d=pigDark(c);return `<svg viewBox="0 0 38 20" width="32" height="17"><path d="M17 15V3" stroke="#1d1b22" stroke-width="1"/><path d="M17.5 3Q22 3.5 26 3L26 10Q22 10.5 17.5 10Z" fill="${p}" stroke="#1d1b22" stroke-width=".9"/><path d="M2 14Q18 16 36 9L35 12Q24 21 3 17Z" fill="${p}" stroke="#1d1b22" stroke-width="1"/><path d="M3 15.5Q20 18 35 10.6" stroke="${d}" stroke-width="1.4" fill="none"/></svg>`}
function legend(d){
  $("dayname").textContent=new Date(d.todayISO+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  $("weekv").textContent=TB.fmt(d.week)+" tokens";
  $("fleet").innerHTML=d.models.slice(0,10).map(m=>`<div>${boatSvg(m.color)}</div><div class="nm">${m.name}</div><div class="am">${TB.fmt(m.tokens)}<small>${(m.share*100).toFixed(m.share<.01?2:1)}%</small></div><div class="bar"><i style="width:${Math.max(.6,m.share*100)}%;background:${pig(m.color)}"></i></div>`).join("");
  const tot=d.measured+d.estimated||1;
  $("sm").style.width=(d.measured/tot*100)+"%";$("se").style.width=(d.estimated/tot*100)+"%";
  $("mv").textContent="measured "+TB.fmt(d.measured);$("ev").textContent="estimated "+TB.fmt(d.estimated);
  $("sig").textContent=`${Math.round(d.measured/tot*100)}% counted · ${Math.round(d.estimated/tot*100)}% estimated`;
  // tide chart, every day
  const sv=$("tide"),n=d.days.length,bw=300/Math.max(n,1);
  sv.setAttribute("viewBox","0 0 300 96");
  let h=`<defs><pattern id="hat" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="3" fill="#5f88b0"/></pattern></defs><line x1="0" y1="95" x2="300" y2="95" stroke="#1d1b22" stroke-width="1"/>`;
  d.days.forEach((x,i)=>{const hh=Math.max(1,92*Math.sqrt(x.tokens/d.maxDay)),he=hh*(x.est/x.tokens||0),X=i*bw+bw*.12,w=bw*.76,isT=x.d===d.todayISO;
    h+=`<g><title>${x.d}: ${TB.full(x.tokens)}${x.est?" (est.)":""}</title><rect x="${X}" y="${95-hh}" width="${w}" height="${hh-he}" fill="${isT?"#b4362c":"#1b365d"}"/>${he?`<rect x="${X}" y="${95-he}" width="${w}" height="${he}" fill="url(#hat)" stroke="#5f88b0" stroke-width=".3"/>`:""}</g>`});
  sv.innerHTML=h;
  $("ndays").textContent=n+" days";
  $("d0").textContent=d.days.length?d.days[0].d:"";$("d1").textContent="today · bar height √tokens";
  $("foot").innerHTML=`Swells: the last ${Math.min(n,print.clientWidth<500?8:14)} days, tallest = biggest day (${TB.fmt(d.maxDay)}). Boats: models, sized by share (hover for names). Wave height and spray: today's activity.${d.demo?' <span class="demo">Sample data, server not reachable.</span>':""}`;
}
TB.onData(d=>{
  if(lastToday!==null&&d.today>lastToday){surge=Math.min(1,surge+.4+Math.log10(1+(d.today-lastToday))/9);sprayAcc+=Math.min(140,(d.today-lastToday)/1e5)}
  lastToday=d.today;D=d;target=d.total;intensity=d.intensity;
  if(!shown)shown=d.total*.995;
  legend(d);
});

/* ---------- tooltips ---------- */
const tip=$("tip");
cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const b=boatHits.find(h=>x>h.x&&x<h.x2&&y>h.y&&y<h.y2), s=!b&&swellHits.find(h=>x>h.x&&x<h.x2&&y>h.y&&y<h.y2);
  if(b)tip.innerHTML=`<b>${b.m.name}</b> · ${TB.full(b.m.tokens)} tokens · ${(b.m.share*100).toFixed(1)}%`;
  else if(s)tip.innerHTML=`<b>${s.d.d}</b> · ${TB.full(s.d.tokens)} tokens${s.d.est?` · ${TB.fmt(s.d.est)} estimated`:""}`;
  if(b||s){tip.style.opacity=1;tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px"}else tip.style.opacity=0;
});
cv.addEventListener("pointerleave",()=>tip.style.opacity=0);

resize();raf=requestAnimationFrame(frame);
})();
</script>
</body>
