<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swirling Token Night</title>
<meta name="description" content="A Van Gogh style night painted live in impasto brush strokes: the sky swirls as fast as today's activity, each model is a starburst sized by its share, and every day of use is a lit window in the village.">
<style>
:root{--cream:#f6e7b8;--ochre:#e2b04a;--ink:#1a1408;--blue:#13254f}
*{box-sizing:border-box}
html,body{margin:0;background:#0b1430;color:var(--cream);overflow-x:hidden}
body{font:14px/1.35 Georgia,"Times New Roman",serif}
#art{position:relative;width:100%;height:100vh}
#paint{position:absolute;inset:0;width:100%;height:100%;display:block}
.plaque{position:absolute;right:26px;bottom:26px;width:470px;padding:16px 20px 14px;border-radius:6px;color:#2b1c08;
  background-color:#c99a45;background-size:cover;
  box-shadow:0 0 0 3px #4a2f0e,0 0 0 6px #b98a3a,0 0 0 8px #3a240a,0 14px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(60,30,0,.45)}
.plaque .kick{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#4a2f0e;display:flex;justify-content:space-between;font-weight:bold}
.plaque .kick i{letter-spacing:.04em;text-transform:none;font-weight:normal}
#num{font-size:46px;font-weight:bold;line-height:1.08;margin:4px 0 2px;letter-spacing:.01em;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;
  color:#1b2c66;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:420px 60px;filter:drop-shadow(1px 1.5px 0 rgba(40,20,0,.55))}
.sub{font-style:italic;font-size:12.5px;color:#4a2f0e}
.row{display:flex;gap:16px;margin:9px 0 6px;flex-wrap:wrap}
.cell .l{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5a3a12}
.cell .v{font-size:20px;font-weight:bold;color:#1b2c66;font-variant-numeric:tabular-nums}
.models{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:13px;border-top:1px solid rgba(74,47,14,.4);padding-top:6px}
.models div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.models b{margin-left:auto;font-variant-numeric:tabular-nums;color:#20160a}
.models s{text-decoration:none;color:#3d2608;font-size:11px;width:38px;text-align:right}
.dab{width:13px;height:11px;border-radius:50% 40% 55% 45%;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),inset 2px 1px 0 rgba(255,255,255,.35);flex:none}
canvas.mini{width:100%;height:44px;display:block;margin-top:7px}
.me{display:flex;justify-content:space-between;font-size:12px;color:#4a2f0e;margin-top:3px}
.me b{color:#20160a;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transition:opacity .12s;background:#f3e1ad;color:#2b1c08;border-radius:4px;padding:8px 11px;font-size:13px;box-shadow:0 0 0 2px #4a2f0e,0 8px 24px rgba(0,0,0,.5);min-width:170px}
#tip .t{font-size:18px;font-weight:bold;color:#1b2c66}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#5a3a12}
#demo{position:absolute;left:16px;top:12px;font-size:11px;letter-spacing:.2em;color:#ffd6a0;display:none;text-shadow:0 1px 2px #000}
@media (max-width:760px){
  #art{height:68vh;min-height:430px}
  .plaque{position:relative;right:auto;bottom:auto;width:auto;margin:18px 16px 26px}
  #num{font-size:clamp(24px,8.4vw,46px)}
  .models{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="art"><canvas id="paint"></canvas><div id="demo">DEMO DATA &middot; SERVER NOT REACHABLE</div></div>
<div class="plaque" id="plaque">
  <div class="kick"><span>The Token Night</span><i>oil on silicon, 2026</i></div>
  <div id="num">0</div>
  <div class="sub" id="sub">tokens burned on this machine</div>
  <div class="row">
    <div class="cell"><div class="l">Tonight</div><div class="v" id="today">0</div></div>
    <div class="cell"><div class="l">Last 7 days</div><div class="v" id="week">0</div></div>
    <div class="cell"><div class="l">Lit windows</div><div class="v" id="nights">0</div></div>
  </div>
  <div class="models" id="models"></div>
  <canvas class="mini" id="hist"></canvas>
  <div class="me"><span>Measured <b id="meas"></b></span><span id="mlab"></span><span>Estimated <b id="est"></b></span></div>
</div>
<div id="tip"></div>
<script src="tb-data.js"></script>
<script>
(function(){
const cv=document.getElementById('paint'),ctx=cv.getContext('2d'),art=document.getElementById('art');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,S=1,D=null,under=null,agents=[],stars=[],vort=[],moon=null,houses=[],windows=[],cyp=[],flares=[];
let anim={from:0,t0:0,dur:3},shown=0,target=0,hover=null,mouse={x:-1e4,y:-1e4},layoutKey='';
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function hex(c){c=c.replace('#','');return[parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]}
function mixA(A,B,t){return[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]}
function css(A,a){return a==null?`rgb(${A[0]|0},${A[1]|0},${A[2]|0})`:`rgba(${A[0]|0},${A[1]|0},${A[2]|0},${a})`}
function jit(A,R,k){const j=(R()-.5)*k;return[A[0]+j,A[1]+j,A[2]+j*1.1]}
const C=s=>hex(s);
const SKY_TOP=C('#0f2263'),SKY_LOW=C('#2a4f9c'),SWIRL1=C('#6d97d8'),SWIRL2=C('#b9d3ee'),SWIRL3=C('#f0f2d8'),DEEP=C('#0a1640'),YEL=C('#f7d64a'),WHITE=C('#fffbe6');
const HILL=[C('#24366f'),C('#33508e'),C('#4b67a3'),C('#1b2a5c'),C('#5a5f9a')];
const FIELD=[C('#1d3a4f'),C('#2b5564'),C('#3f6e5c'),C('#14283c'),C('#4d7a6a'),C('#22404a')];

// ---------- geometry
function farRidge(x){return H*.58+Math.sin(x/W*5.2+.8)*H*.035+Math.sin(x/W*13+2)*H*.012-Math.max(0,(x/W-.55))*H*.06}
function nearHill(x){return H*.71+Math.sin(x/W*3.4+2.2)*H*.03+Math.sin(x/W*9.1)*H*.012}
function flow(x,y,t){
  let vx=1+.35*Math.sin(y*.011/S+t*.25+x*.002/S),vy=.28*Math.sin(x*.009/S-t*.2+y*.003/S);
  for(const v of vort){const dx=x-v.x,dy=y-v.y,d2=dx*dx+dy*dy;if(d2>v.r2*9)continue;const f=v.s*Math.exp(-d2/v.r2),d=Math.sqrt(d2)+1;vx+=(-dy/d*3-dx/d*.35)*f;vy+=(dx/d*3-dy/d*.35)*f}
  return[vx,vy]}
function skyColor(x,y,R){
  const hz=farRidge(x),k=Math.max(0,Math.min(1,y/hz));let c=mixA(SKY_TOP,SKY_LOW,k*k);
  let sw=0,ring=0;for(const v of vort){if(v.star)continue;const d=Math.hypot(x-v.x,y-v.y);const e=Math.exp(-(d*d)/(v.r2*1.4));sw+=e;ring=Math.max(ring,e*(.5+.5*Math.sin(d/(Math.sqrt(v.r2)*.16)+v.ph)))}
  const band=.5+.5*Math.sin(y*.035/S+Math.sin(x*.006/S)*2.4);
  c=mixA(c,SWIRL1,Math.min(.85,ring*.9+band*.18));if(ring>.62&&R()<.55)c=mixA(c,SWIRL2,.7);if(ring>.8&&R()<.25)c=mixA(c,SWIRL3,.6);
  if(R()<.12)c=mixA(c,DEEP,.5);
  for(const s of stars){const d=Math.hypot(x-s.x,y-s.y);if(d<s.R*2.8){const q=1-d/(s.R*2.8);c=mixA(c,mixA(s.rgb,YEL,.45),q*q*.6)}}
  if(moon){const d=Math.hypot(x-moon.x,y-moon.y);if(d<moon.R*3){const q=1-d/(moon.R*3);c=mixA(c,C('#e9c45a'),q*q*.55)}}
  return jit(c,R,22)}

function brush(g,x,y,ang,len,w,col,R,hiK){
  const dx=Math.cos(ang)*len/2,dy=Math.sin(ang)*len/2,nx=-dy/len*2,ny=dx/len*2,b=(R()-.5)*w*.9;
  g.strokeStyle=css(mixA(col,[0,0,0],.38),.55);g.lineWidth=w+1.1*S;g.beginPath();g.moveTo(x-dx+.7,y-dy+.9);g.quadraticCurveTo(x+nx*b+.7,y+ny*b+.9,x+dx+.7,y+dy+.9);g.stroke();
  g.strokeStyle=css(col);g.lineWidth=w;g.beginPath();g.moveTo(x-dx,y-dy);g.quadraticCurveTo(x+nx*b,y+ny*b,x+dx,y+dy);g.stroke();
  if(hiK){g.strokeStyle=css(mixA(col,[255,255,240],hiK),.75);g.lineWidth=w*.32;g.beginPath();g.moveTo(x-dx*.8-nx*w*.25,y-dy*.8-ny*w*.25);g.quadraticCurveTo(x+nx*(b-w*.25),y+ny*(b-w*.25),x+dx*.6-nx*w*.25,y+dy*.6-ny*w*.25);g.stroke()}
}

// ---------- layout
const SLOTS=[[.34,.25],[.66,.15],[.75,.41],[.52,.47],[.2,.49],[.47,.1],[.89,.47]];
function layout(){
  const r=art.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(2,devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.max(.42,Math.min(W/1300,H/800));
  if(!D)return;
  const phone=W<760;
  const ms=D.models.slice(0,7);
  stars=ms.map((m,i)=>{const sl=SLOTS[i];const R=(phone?17:20)*S+(phone?58:64)*S*Math.sqrt(m.share);
    return{m,x:sl[0]*W,y:sl[1]*H,R,rgb:C(m.color),i}});
  if(phone){stars.forEach((s,i)=>{const p=[[.36,.2],[.72,.12],[.78,.4],[.5,.45],[.27,.5],[.5,.07],[.92,.3]][i];s.x=p[0]*W;s.y=p[1]*H})}
  if(!phone){const pr=$('plaque').getBoundingClientRect(),ar=art.getBoundingClientRect();const L=pr.left-ar.left,T=pr.top-ar.top;
    for(const s of stars){if(s.x+s.R>L-20&&s.y+s.R*1.9>T-10)s.y=Math.max(s.R*1.2,T-s.R*1.9-24*S)}}
  moon={x:W*(phone?.86:.9),y:H*(phone?.13:.14),R:(phone?26:44)*S};
  vort=[{x:W*.5,y:H*.31,r2:(W*.13)**2,s:1.1,ph:0},{x:W*.62,y:H*.3,r2:(W*.075)**2,s:-1.3,ph:1.3},{x:W*.16,y:H*.18,r2:(W*.08)**2,s:.7,ph:2}];
  for(const s of stars)vort.push({x:s.x,y:s.y,r2:(s.R*1.9)**2,s:1.6,star:1,ph:0});
  vort.push({x:moon.x,y:moon.y,r2:(moon.R*2.2)**2,s:1.2,star:1});
  buildVillage(phone);buildUnder();buildHalos();buildCypress(phone);bakeCypress();spawnAgents();
}
function buildVillage(phone){
  const R=rng(31337);houses=[];windows=[];if(!D)return;const n=D.days.length;
  const x0=W*(phone?.2:.17);let x1=W*(phone?.86:.6);if(!phone){const pr=$('plaque').getBoundingClientRect(),ar=art.getBoundingClientRect();x1=Math.max(W*.42,Math.min(x1,pr.left-ar.left-30))}
  const cap=Math.max(4,Math.floor((x1-x0)/(34*S*(phone?.8:1))));let maxw=4,need=Math.ceil(n/3)+1;if(need>cap*3){maxw=6;need=Math.ceil(n/5)+1}const nr=Math.max(2,Math.min(4,Math.ceil(need/cap)));
  const rows=[];for(let i=0;i<nr;i++)rows.push({yo:(-4+i*(nr>2?13:18))*S,sc:.78+.22*i/(nr-1)});
  const per=Math.ceil(need/nr);
  for(const [ri,row] of rows.entries()){
    const cnt=Math.max(4,per);const step=(x1-x0)/cnt;
    for(let i=0;i<cnt;i++){
      const cx=x0+step*(i+.5)+(R()-.5)*step*.2;const hw=Math.min(step*.44,(17+R()*9)*S*row.sc)*(phone?1.15:1);const hh=(19+R()*14)*S*row.sc;
      const by=nearHill(cx)+row.yo+(ri?6*S:0);
      houses.push({cx,by,hw,hh,row:ri,roof:R()<.5?'gable':'flat',col:[C('#2e4f8c'),C('#3d5b7d'),C('#6b6f8e'),C('#c9a24a')][R()*4|0],nw:0})}
  }
  // church in the back row
  const ch=houses.find(h=>h.row===0&&h.cx>x0+(x1-x0)*.45);if(ch){ch.church=1;ch.hh*=1.25}
  // windows chronological, back row first then front row, left to right
  const order=houses.slice().sort((a,b)=>a.row-b.row||a.cx-b.cx);
  let di=0;let guard=0;
  while(di<n&&guard++<20){for(const h of order){if(di>=n)break;if(h.nw>=maxw)continue;h.nw++;di++}}
  for(const h of order){const k=h.nw;const ww=Math.max(3,5.4*S*(h.row?1:.85)),wh=ww*1.25;
    const cols=k<=2?k:k<=4?2:3,rows2=Math.ceil(k/cols);
    for(let j=0;j<k;j++){const c=j%cols,r2=Math.floor(j/cols);
      const gx=h.cx+(cols===1?0:(c/(cols-1)-.5)*h.hw*(cols>2?1.3:.84)),gy=h.by-h.hh*(rows2===1?.45:.28+.42*r2/(rows2-1));
      windows.push({x:gx,y:gy,w:ww,h:wh,day:D.days[windows.length],ph:R()*7})}}
}
function buildUnder(){
  under=document.createElement('canvas');under.width=W*DPR;under.height=H*DPR;const g=under.getContext('2d');g.scale(DPR,DPR);g.lineCap='round';
  const R=rng(777);
  g.fillStyle='#182f6e';g.fillRect(0,0,W,H);
  const ground=g.createLinearGradient(0,H*.6,0,H);ground.addColorStop(0,'#21386e');ground.addColorStop(1,'#10202e');g.fillStyle=ground;g.fillRect(0,H*.62,W,H*.38);
  const n=Math.min(30000,W*H/(34*S*S));const L=15*S,Wd=4.6*S;
  for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H;const fr=farRidge(x),nh=nearHill(x);
    let ang,col,len=L*(.7+R()*.6),w=Wd*(.75+R()*.5),hi=.25;
    if(y<fr){const v=flow(x,y,0);ang=Math.atan2(v[1],v[0]);col=skyColor(x,y,R)}
    else if(y<nh){ang=Math.atan2(farRidge(x+5)-farRidge(x-5),10)+(R()-.5)*.5+Math.sin(y*.08)*.4;const k=(y-fr)/(nh-fr);col=jit(mixA(HILL[R()*HILL.length|0],C('#0f1d45'),k*.5),R,20);hi=.15}
    else{const k=(y-nh)/(H-nh);ang=Math.sin(x*.012/S+y*.02/S)*.6+(R()-.5)*.4;col=jit(mixA(FIELD[R()*FIELD.length|0],C('#0c1820'),k*.55),R,18);hi=.12;len*=1.15}
    brush(g,x,y,ang,len,w,col,R,hi);
  }
  // ridge outline strokes
  for(let x=0;x<W;x+=6*S){const y=farRidge(x);brush(g,x,y,Math.atan2(farRidge(x+5)-farRidge(x-5),10),10*S,3*S,C('#16245a'),R,0)}
  // houses
  for(const h of houses.slice().sort((a,b)=>a.row-b.row)){
    const {cx,by,hw,hh}=h;
    for(let yy=by-hh;yy<by;yy+=3.2*S)for(let xx=cx-hw;xx<cx+hw;xx+=6*S){brush(g,xx+3*S,yy+1.5*S,(R()-.5)*.4+(R()<.3?1.57:0),6*S,3.2*S,jit(h.col,R,26),R,.15)}
    g.save();g.lineWidth=3.6*S;g.strokeStyle=css(C('#101a33'));g.lineJoin='round';
    if(h.roof==='gable'||h.church){const rh=hh*.55;g.fillStyle=css(jit(C(h.church?'#1d2d55':'#3a3446'),R,18));g.beginPath();g.moveTo(cx-hw-2*S,by-hh);g.lineTo(cx,by-hh-rh);g.lineTo(cx+hw+2*S,by-hh);g.closePath();g.fill();g.stroke();
      for(let k=0;k<5;k++)brush(g,cx-hw*.6+R()*hw*1.2,by-hh-rh*.35,(R()<.5?-1:1)*.5,7*S,2.4*S,C('#5a4a5e'),R,.2)}
    else{g.fillStyle=css(C('#24304e'));g.fillRect(cx-hw-1.5*S,by-hh-4*S,hw*2+3*S,5*S)}
    g.strokeRect(cx-hw,by-hh,hw*2,hh);
    if(h.church){const sx=cx,sy=by-hh-hh*.4;g.fillStyle=css(C('#1a2850'));g.beginPath();g.moveTo(sx-4*S,sy);g.lineTo(sx,sy-hh*1.9);g.lineTo(sx+4*S,sy);g.closePath();g.fill();g.stroke()}
    g.restore();
  }
}
// halos pre-rendered: rotating rings as offscreen canvases
function ringCanvas(cx,cy,r,w,colsFn,R){
  const sz=Math.ceil((r+w*2)*2);const c=document.createElement('canvas');c.width=sz*DPR;c.height=sz*DPR;const g=c.getContext('2d');g.scale(DPR,DPR);g.lineCap='round';
  const seg=Math.max(7*S,w*2.2),n=Math.max(8,Math.floor(2*Math.PI*r/(seg*.8)));
  for(let j=0;j<n;j++){const a0=j/n*2*Math.PI+(R()-.5)*.05,a1=a0+seg/r*(.8+R()*.3),col=colsFn(R);const rr=r+(R()-.5)*w*.6;
    g.strokeStyle=css(mixA(col,[0,0,0],.35),.5);g.lineWidth=w+S;g.beginPath();g.arc(sz/2+.6,sz/2+.8,rr,a0,a1);g.stroke();
    g.strokeStyle=css(col);g.lineWidth=w;g.beginPath();g.arc(sz/2,sz/2,rr,a0,a1);g.stroke();
    g.strokeStyle=css(mixA(col,[255,255,245],.5),.7);g.lineWidth=w*.3;g.beginPath();g.arc(sz/2,sz/2,rr-w*.22,a0+.02,a1-.04);g.stroke()}
  return{c,sz}}
function buildHalos(){
  const R=rng(2024);
  for(const s of stars){
    s.rings=[];const nr=s.R>50*S?7:s.R>30*S?5:4;const w=Math.max(3,4*S*(.8+s.R/(110*S)));
    const core=mixA(s.rgb,WHITE,.55),warm=mixA(s.rgb,YEL,.35);
    for(let k=0;k<nr;k++){const r=s.R*(.36+k*(1.2/(nr-1)));const kk=k/(nr-1||1);
      s.rings.push({...ringCanvas(0,0,r,w,R=>{const p=R();if(kk<.35)return jit(p<.5?core:WHITE,R,25);if(kk<.7)return jit(p<.45?s.rgb:p<.8?warm:core,R,30);return jit(p<.5?mixA(s.rgb,SWIRL1,.45):mixA(s.rgb,SWIRL2,.3),R,26)},R),dir:k%2?-1:1,sp:.6+R()*.5})}
  }
  // moon: halo rings + crescent
  const m=moon;m.rings=[];const w=Math.max(3.4,5*S);
  for(let k=0;k<4;k++){const r=m.R*(1.15+k*.42);m.rings.push({...ringCanvas(0,0,r,w,R=>jit(R()<.5?C('#f2c94c'):R()<.5?C('#e8a83a'):C('#f8e7a0'),R,30),R),dir:k%2?-1:1,sp:.4})}
  const sz=Math.ceil(m.R*2.4),c=document.createElement('canvas');c.width=sz*DPR;c.height=sz*DPR;const g=c.getContext('2d');g.scale(DPR,DPR);g.lineCap='round';
  g.fillStyle='#f3c23e';g.beginPath();g.arc(sz/2,sz/2,m.R,0,7);g.fill();
  for(let i=0;i<m.R*m.R/(5*S*S);i++){const a=R()*7,rr=Math.sqrt(R())*m.R*.92;const x=sz/2+Math.cos(a)*rr,y=sz/2+Math.sin(a)*rr,an=a+1.57,l=5*S;g.globalCompositeOperation='source-atop';g.lineCap='round';g.strokeStyle=css(jit(R()<.55?C('#f8cf48'):R()<.5?C('#fff0b0'):C('#eea53a'),R,25));g.lineWidth=4*S;g.beginPath();g.moveTo(x-Math.cos(an)*l,y-Math.sin(an)*l);g.lineTo(x+Math.cos(an)*l,y+Math.sin(an)*l);g.stroke();g.globalCompositeOperation='source-over'}
  g.globalCompositeOperation='destination-out';g.beginPath();g.arc(sz/2+m.R*.5,sz/2-m.R*.28,m.R*.84,0,7);g.fill();g.globalCompositeOperation='source-over';m.cres={c,sz};
}
function buildCypress(phone){
  const R=rng(555);cyp=[];const bx=W*(phone?.08:.1),base=H+10,top=H*(phone?.14:.06),hw=W*(phone?.075:.055)+14*S;
  const n=Math.min(900,Math.floor(620*S+200));
  for(let i=0;i<n;i++){const u=R();const y=top+(base-top)*Math.pow(u,.8);const f=(y-top)/(base-top);
    const width=hw*Math.sin(Math.min(1,f*1.2)*Math.PI*.5)*(f>.85?1:1)*(.9+.2*Math.sin(f*18));
    const x=bx+(R()-.5)*2*width;const len=(14+R()*22)*S*(.5+f*.7);
    cyp.push({x,y,f,len,w:(4.2+R()*3)*S,curl:(R()-.5)*1.4,col:jit([C('#13261c'),C('#1e3a26'),C('#2b4b2c'),C('#0e1a17'),C('#3c3020'),C('#46663a')][R()*6|0],R,14),ph:R()*7})}
  cyp.sort((a,b)=>a.f-b.f);cyp.shape={bx,base,top,hw};
}
function spawnAgent(a,R){
  for(let k=0;k<12;k++){const x=Math.random()*W,y=Math.random()*H*.62;if(y<farRidge(x)-6){a.x=x;a.y=y;break}}
  a.life=80+Math.random()*220;a.w=(3.4+Math.random()*2.6)*S;a.len=(14+Math.random()*12)*S;a.c=skyColor(a.x,a.y,Math.random);a.c=mixA(a.c,SWIRL2,.12+Math.random()*.2);a.age=0;a.hi=.3+Math.random()*.3;return a}
function spawnAgents(){const n=Math.max(200,Math.min(900,W*H/1150));agents=[];for(let i=0;i<n;i++){const a=spawnAgent({});a.age=Math.random()*a.life;agents.push(a)}}

// ---------- draw
function drawAgents(t,dt){
  const spd=(10+80*(D?D.intensity:.3))*S;ctx.lineCap='round';
  for(const a of agents){
    const v=flow(a.x,a.y,t),m=Math.hypot(v[0],v[1])+.001;a.x+=v[0]/m*spd*dt;a.y+=v[1]/m*spd*dt;a.age+=dt*60;
    if(a.age>a.life||a.x>W+20||a.x<-20||a.y<-20||a.y>farRidge(a.x)-3){spawnAgent(a);continue}
    if((a.age|0)%40===0)a.c=mixA(skyColor(a.x,a.y,Math.random),SWIRL2,.15);
    const fade=Math.min(1,a.age/25,(a.life-a.age)/25);
    // trace backwards along flow
    const pts=[[a.x,a.y]];let x=a.x,y=a.y;const st=a.len/3;
    for(let k=0;k<3;k++){const v2=flow(x,y,t),m2=Math.hypot(v2[0],v2[1])+.001;x-=v2[0]/m2*st;y-=v2[1]/m2*st;pts.push([x,y])}
    ctx.globalAlpha=fade;
    ctx.strokeStyle=css(a.c);ctx.lineWidth=a.w;ctx.beginPath();ctx.moveTo(pts[3][0],pts[3][1]);ctx.quadraticCurveTo(pts[2][0],pts[2][1],pts[1][0],pts[1][1]);ctx.lineTo(pts[0][0],pts[0][1]);ctx.stroke();
    ctx.strokeStyle=css(mixA(a.c,[255,255,240],a.hi),.8);ctx.lineWidth=a.w*.3;ctx.beginPath();ctx.moveTo(pts[2][0]-.8,pts[2][1]-.8);ctx.lineTo(pts[1][0]-.8,pts[1][1]-.8);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawRings(o,t,spin){
  for(const r of o.rings){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(t*r.sp*r.dir*spin);ctx.drawImage(r.c,-r.sz/2,-r.sz/2,r.sz,r.sz);ctx.restore()}}
function drawStars(t){
  const spin=.08+.5*(D?D.intensity:.3);
  for(const s of stars){
    ctx.save();ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.R*2.6);gl.addColorStop(0,css(mixA(s.rgb,WHITE,.4),.55));gl.addColorStop(.4,css(s.rgb,.18));gl.addColorStop(1,css(s.rgb,0));
    ctx.fillStyle=gl;ctx.fillRect(s.x-s.R*2.6,s.y-s.R*2.6,s.R*5.2,s.R*5.2);ctx.restore();
    drawRings(s,t,spin*(1.4-s.i*.1));
    // core: radiating dabs
    const cr=s.R*.3;ctx.lineCap='round';
    for(let k=0;k<14;k++){const a=k/14*6.283+t*.3;const l=cr*(.7+.3*Math.sin(t*2+k));ctx.strokeStyle=css(k%2?WHITE:mixA(s.rgb,YEL,.5));ctx.lineWidth=Math.max(2.5,3.6*S);
      ctx.beginPath();ctx.moveTo(s.x+Math.cos(a)*cr*.15,s.y+Math.sin(a)*cr*.15);ctx.lineTo(s.x+Math.cos(a)*l,s.y+Math.sin(a)*l);ctx.stroke()}
    ctx.fillStyle=css(WHITE);ctx.beginPath();ctx.arc(s.x,s.y,cr*.35,0,7);ctx.fill();
    // painted label
    const lab=s.m.name,amt=TB.fmt(s.m.tokens);const fs=Math.max(11,Math.round(13*S+s.R*.06));
    ctx.font=`italic bold ${fs}px Georgia,serif`;ctx.textAlign='center';const ly=s.y+s.R*1.62+fs;const tw2=ctx.measureText(lab+'  '+amt).width/2+6;const lx=Math.max(tw2,Math.min(W-tw2,s.x));
    ctx.fillStyle='rgba(8,14,40,.75)';ctx.fillText(lab+'  '+amt,lx+1.2,ly+1.5);ctx.fillStyle=hover===s?'#fffbe6':'#f6e7b8';ctx.fillText(lab+'  '+amt,lx,ly);
  }
}
function drawMoon(t){const m=moon;ctx.save();ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.R*3.2);gl.addColorStop(0,'rgba(255,220,120,.4)');gl.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=gl;ctx.fillRect(m.x-m.R*3.2,m.y-m.R*3.2,m.R*6.4,m.R*6.4);ctx.restore();
  drawRings(m,t,.12);ctx.drawImage(m.cres.c,m.x-m.cres.sz/2,m.y-m.cres.sz/2,m.cres.sz,m.cres.sz)}
function drawWindows(t){
  ctx.save();
  for(const w of windows){if(!w.day)continue;const f=Math.sqrt(w.day.tokens/D.maxDay),est=w.day.est>w.day.tokens*.5,today=w.day.d===D.todayISO;
    const fl=.85+.15*Math.sin(t*(3+f*4)+w.ph)*Math.sin(t*1.7+w.ph*2);let b=(.35+.65*f)*fl;if(today)b=.8+.2*Math.sin(t*6);
    const col=est?mixA(C('#c98a3a'),C('#8fa6d8'),.35):mixA(C('#f2b33a'),C('#fff2a0'),f);
    ctx.globalCompositeOperation='lighter';const gr=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.w*4);gr.addColorStop(0,css(col,.7*b));gr.addColorStop(1,css(col,0));ctx.fillStyle=gr;ctx.fillRect(w.x-w.w*4,w.y-w.w*4,w.w*8,w.w*8);
    ctx.globalCompositeOperation='source-over';ctx.fillStyle=css(mixA(C('#1a1630'),col,.25+.75*b));ctx.fillRect(w.x-w.w/2,w.y-w.h/2,w.w,w.h);
    if(hover===w||today){ctx.strokeStyle=today?'#fff6c8':'#ffffff';ctx.lineWidth=1.2;ctx.strokeRect(w.x-w.w/2-2,w.y-w.h/2-2,w.w+4,w.h+4)}
  }ctx.restore()}
function paintCypress(ctx){
  const t=0;ctx.lineCap='round';const sway=0;
  const sh=cyp.shape;if(sh){ctx.fillStyle='#0b1712';ctx.beginPath();const N=40;
    for(let i=0;i<=N;i++){const f=i/N,y=sh.top+(sh.base-sh.top)*f,wd=sh.hw*Math.sin(Math.min(1,f*1.2)*Math.PI*.5)*.85*(.9+.2*Math.sin(f*18)),ox=Math.sin(t*.9+y*.012/S)*(1-f)*(1-f)*10*S*sway;i?ctx.lineTo(sh.bx+ox+wd,y):ctx.moveTo(sh.bx+ox,y)}
    for(let i=N;i>=0;i--){const f=i/N,y=sh.top+(sh.base-sh.top)*f,wd=sh.hw*Math.sin(Math.min(1,f*1.2)*Math.PI*.5)*.85*(.9+.2*Math.sin(f*18+1)),ox=Math.sin(t*.9+y*.012/S)*(1-f)*(1-f)*10*S*sway;ctx.lineTo(sh.bx+ox-wd,y)}ctx.fill()}
  for(const c of cyp){const k=(1-c.f);const ox=Math.sin(t*.9+c.y*.012/S)*k*k*10*S*sway+0;
    const x=c.x+ox,y=c.y;const cx=x+c.curl*c.len*.5,cy=y-c.len*.5;
    ctx.strokeStyle=css(mixA(c.col,[0,0,0],.4));ctx.lineWidth=c.w+1.2*S;ctx.beginPath();ctx.moveTo(x+.8,y+1);ctx.quadraticCurveTo(cx+.8,cy+1,x+c.curl*c.len*.2+.8,y-c.len+1);ctx.stroke();
    ctx.strokeStyle=css(c.col);ctx.lineWidth=c.w;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(cx,cy,x+c.curl*c.len*.2,y-c.len);ctx.stroke();
    if(c.ph>5.2){ctx.strokeStyle=css(mixA(c.col,C('#8aa86a'),.45),.7);ctx.lineWidth=c.w*.3;ctx.beginPath();ctx.moveTo(x-1,y-2);ctx.quadraticCurveTo(cx-1,cy-1,x+c.curl*c.len*.2-1,y-c.len*.9);ctx.stroke()}}
}
function bakeCypress(){const sh=cyp.shape;const x0=Math.max(0,sh.bx-sh.hw*1.9),x1=sh.bx+sh.hw*1.9,y0=Math.max(0,sh.top-60*S);
  const c=document.createElement('canvas');c.width=Math.ceil((x1-x0)*DPR);c.height=Math.ceil((H-y0)*DPR);const g=c.getContext('2d');g.scale(DPR,DPR);g.translate(-x0,-y0);paintCypress(g);cyp.img={c,x0,y0,w:x1-x0,h:H-y0}}
function drawCypress(t){const im=cyp.img;if(!im)return;const sh=cyp.shape,sway=1+(D?D.intensity:.3)*1.5,st=6;
  for(let y=0;y<im.h;y+=st){const yy=im.y0+y,f=Math.max(0,(yy-sh.top)/(sh.base-sh.top)),k=1-f;const ox=Math.sin(t*.9+yy*.012/S)*k*k*10*S*sway;
    ctx.drawImage(im.c,0,y*DPR,im.c.width,Math.min(st,im.h-y)*DPR,im.x0+ox,yy,im.w,Math.min(st,im.h-y)+.5)}}
function drawFlares(t){ctx.save();ctx.lineCap='round';flares=flares.filter(f=>{const k=(t-f.t0)/3;if(k>1)return false;const r=f.r+k*W*.35;const n=60;ctx.globalAlpha=1-k;
  for(let j=0;j<n;j++){const a=j/n*6.283+k;ctx.strokeStyle=j%2?'#fff3b0':'#f2c94c';ctx.lineWidth=5*S*(1-k)+1;ctx.beginPath();ctx.arc(f.x,f.y,r,a,a+.06);ctx.stroke()}
  ctx.font=`italic bold ${Math.round(22*S+6)}px Georgia,serif`;ctx.textAlign='center';ctx.fillStyle='#fff3c0';ctx.fillText(f.label,f.x,f.y-f.r-10-k*30);return true});ctx.restore()}

const FPS=/[?&]fps=1/.test(location.search)?{n:0,t:performance.now()/1000}:null;
let lastT=performance.now()/1000,lastStr='';
function frame(now){
  requestAnimationFrame(frame);if(document.hidden||!under||!D)return;
  const t=now/1000,rdt=Math.max(0,t-lastT),dt=Math.min(.05,rdt);lastT=t;
  if(FPS){FPS.n++;if(t-FPS.t>2){document.title='fps '+(FPS.n/(t-FPS.t)).toFixed(1);FPS.n=0;FPS.t=t}}
  ctx.drawImage(under,0,0,W,H);
  drawAgents(t,dt);drawMoon(t);drawStars(t);drawWindows(t);drawCypress(t);drawFlares(t);
  if(target){const prev=shown;const k=Math.min(1,(t-anim.t0)/anim.dur);shown=anim.from+(target-anim.from)*(1-Math.pow(1-k,3));
    if(Math.floor(shown/1e9)>Math.floor(prev/1e9)&&prev>0&&stars[0])flares.push({x:stars[0].x,y:stars[0].y,r:stars[0].R,t0:t,label:Math.floor(shown/1e9)+' billion'});
    const s=TB.full(shown);if(s!==lastStr){lastStr=s;$('num').textContent=s}}
}

// ---------- hover
function pick(){
  const r=cv.getBoundingClientRect();const x=mouse.x-r.left,y=mouse.y-r.top;let best=null,bd=1e9;
  for(const w of windows){if(!w.day)continue;const d=Math.hypot(w.x-x,w.y-y);if(d<Math.max(8,w.w*1.6)&&d<bd){bd=d;best=w}}
  if(!best)for(const s of stars){const d=Math.hypot(s.x-x,s.y-y);if(d<s.R*1.3&&d<bd){bd=d;best=s}}
  hover=best;const tip=$('tip');if(!best){tip.style.opacity=0;return}
  if(best.day){const x2=best.day;const parts=Object.entries(x2.byModel).sort((a,b)=>b[1]-a[1]).slice(0,4);
    tip.innerHTML=`<div class="r"><span>${new Date(x2.d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span><span>window ${windows.indexOf(best)+1}</span></div><div class="t">${TB.full(x2.tokens)}</div>`+parts.map(([n,v])=>`<div class="r"><span><span class="dab" style="display:inline-block;background:${TB.color(n)};width:9px;height:8px"></span> ${n}</span><span>${TB.fmt(v)}</span></div>`).join('')+(x2.est?`<div class="r"><i>estimated</i><span>${TB.fmt(x2.est)}</span></div>`:'')}
  else{const m=best.m;tip.innerHTML=`<div class="r"><span>${m.name}</span><span>${(m.share*100).toFixed(m.share<.01?2:1)}% of all</span></div><div class="t">${TB.full(m.tokens)}</div><div class="r"><i>star size = share</i></div>`}
  tip.style.opacity=1;const tw=tip.offsetWidth,th=tip.offsetHeight;let lx=mouse.x+16,ly=mouse.y+16;if(lx+tw>innerWidth-8)lx=mouse.x-tw-16;if(ly+th>innerHeight-8)ly=mouse.y-th-16;tip.style.left=Math.max(8,lx)+'px';tip.style.top=Math.max(8,ly)+'px'}
cv.addEventListener('mousemove',e=>{mouse={x:e.clientX,y:e.clientY};pick()});
cv.addEventListener('mouseleave',()=>{hover=null;$('tip').style.opacity=0});
cv.addEventListener('touchstart',e=>{const t=e.touches[0];mouse={x:t.clientX,y:t.clientY};pick()},{passive:true});

// ---------- plaque textures
function paintTex(w,h,pal,seed,horiz){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const R=rng(seed);g.fillStyle=css(pal[0]);g.fillRect(0,0,w,h);g.lineCap='round';
  for(let i=0;i<w*h/60;i++){const x=R()*w,y=R()*h,a=horiz?(R()-.5)*.5:R()*7;brush(g,x,y,a,10+R()*10,3+R()*3,jit(pal[R()*pal.length|0],R,24),R,.25)}return c.toDataURL('image/jpeg',.85)}
function plaqueTextures(){
  $('plaque').style.backgroundImage=`linear-gradient(rgba(236,204,132,.55),rgba(222,184,104,.5)),url(${paintTex(520,420,[C('#c99a45'),C('#d4a850'),C('#bf9038'),C('#dcb562'),C('#b4842f')],7,true)})`;
  $('num').style.backgroundImage=`url(${paintTex(420,60,[C('#16307a'),C('#1f3f95'),C('#0f2260'),C('#2d56b0'),C('#3d6cc4')],11,false)})`}
function drawHist(){const c=$('hist'),r=c.getBoundingClientRect();if(!r.width)return;const dp=Math.min(2,devicePixelRatio||1);c.width=r.width*dp;c.height=r.height*dp;const g=c.getContext('2d');g.scale(dp,dp);g.lineCap='round';
  const R=rng(5),days=D.days,n=days.length,w=r.width,h=r.height;const bw=Math.max(2.5,w/n*.72);
  days.forEach((x,i)=>{const px=(i+.5)/n*w,bh=Math.max(2,Math.sqrt(x.tokens/D.maxDay)*(h-6));const est=x.est>x.tokens*.5;let dom='Other',dv=0;for(const k in x.byModel)if(x.byModel[k]>dv){dv=x.byModel[k];dom=k}
    const col=est?C('#6f7fa8'):mixA(C(TB.color(dom)),C('#f2c94c'),.2);
    g.strokeStyle=css(mixA(col,[0,0,0],.4),.6);g.lineWidth=bw+1;g.beginPath();g.moveTo(px+.6,h-2);g.lineTo(px+.6+(R()-.5)*1.5,h-2-bh+.8);g.stroke();
    g.strokeStyle=css(col);g.lineWidth=bw;g.beginPath();g.moveTo(px,h-2);g.lineTo(px+(R()-.5)*1.5,h-2-bh);g.stroke()});
}

TB.onData(d=>{
  const first=!D;D=d;
  const key=d.days.length+'|'+d.models.slice(0,7).map(m=>m.name+(m.share*100|0)).join(',');
  if(first){plaqueTextures();shown=Math.max(0,Math.floor(d.total/1e9)*1e9-d.total*.004)}
  if(key!==layoutKey){layoutKey=key;layout()}else windows.forEach((w,i)=>w.day=d.days[i]);
  anim={from:shown,t0:performance.now()/1000,dur:first?3.2:2};target=d.total;
  $('sub').textContent='tokens burned on this machine since '+new Date(d.firstDay+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  $('today').textContent=TB.full(d.today);$('week').textContent=TB.fmt(d.week);$('nights').textContent=d.days.length;
  $('models').innerHTML=d.models.slice(0,8).map(m=>`<div><span class="dab" style="background:${m.color}"></span>${m.name}<b>${TB.fmt(m.tokens)}</b><s>${(m.share*100).toFixed(m.share<.01?2:1)}%</s></div>`).join('');
  const me=d.measured/((d.measured+d.estimated)||1);$('meas').textContent=TB.fmt(d.measured)+' ('+(me*100).toFixed(0)+'%)';$('est').textContent=TB.fmt(d.estimated)+' ('+((1-me)*100).toFixed(0)+'%)';
  $('mlab').innerHTML='<i>bars: days · blue-grey = estimated</i>';
  $('demo').style.display=d.demo?'block':'none';
  drawHist();
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{layout();if(D)drawHist()},150)});
layout();requestAnimationFrame(frame);
})();
</script>
