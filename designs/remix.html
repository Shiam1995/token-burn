<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remix Engine</title>
<meta name="description" content="1000 generated Token Burn designs, one per seed">
<style id="basecss">
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
#bg,#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#bg{z-index:0}#fx{z-index:6;pointer-events:none}
#decor{position:fixed;inset:0;pointer-events:none;z-index:3}
#app{position:relative;z-index:2;height:100vh;padding:var(--pad);display:grid;gap:var(--gap)}
.pn{position:relative;padding:14px 18px;border-radius:var(--r);display:flex;flex-direction:column;min-width:0;min-height:0;color:var(--text)}
.pn h3{margin:0 0 8px;font:600 11px/1.2 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pn h3 em{font-style:normal;letter-spacing:.04em;text-transform:none;font-weight:500}
.hd{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{min-width:0}
.kick{font:600 11px/1.2 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.nm{margin:2px 0 0;font:var(--hw) 24px/1.1 var(--fd);letter-spacing:var(--hls);color:var(--text)}
.nm small{font:500 .55em var(--fb);color:var(--mut);letter-spacing:.06em;margin-left:.4em;white-space:nowrap}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font:600 11px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:99px;border:1px solid var(--line);color:var(--text)}
.badge b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:0;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.ctl{display:flex;align-items:center;gap:4px;font:600 12px var(--fb)}
.ctl button,.ctl a{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;text-decoration:none;line-height:1.1}
.ctl button:hover,.ctl a:hover{border-color:var(--acc)}
.ctl .sd{padding:0 6px;color:var(--mut);white-space:nowrap}
.ct{justify-content:center}
.ct .lbl{font:600 12px/1.2 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.ctr-wrap{width:100%;overflow:hidden;padding:.06em 0}
.ctr{display:inline-block;white-space:nowrap;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--text)}
.sub{font-size:13px;color:var(--mut);margin-top:4px}
.sub b{color:var(--text);font-weight:600}
.split{margin-top:12px}
.sb{display:flex;height:12px;border-radius:min(var(--r),6px);overflow:hidden;background:var(--track)}
.sb i{display:block;height:100%}
.sb .m{background:var(--acc)}
.sl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:6px;color:var(--mut)}
.sl b{color:var(--text);font-weight:600}
.sl .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sp2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sp2 div{border-left:3px solid var(--acc);padding:2px 0 2px 10px}
.sp2 div+div{border-left-style:dashed}
.sp2 .v{font:var(--hw) 20px/1.1 var(--fd);color:var(--text);font-variant-numeric:tabular-nums}
.sp2 .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sp3{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--mut)}
.sp3 b{color:var(--text)}
.st .today{font:var(--hw) 34px/1.05 var(--fd);color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.st .tfull{font-size:12px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--track);margin:10px 0 12px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:3px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.minis div{min-width:0}
.minis .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.minis .v{font:600 16px/1.2 var(--fd);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini14{flex:1;min-height:0;position:relative;margin-top:12px}.mini14 svg{position:absolute;left:0;bottom:0}.mini14 text{font-size:10.5px;fill:var(--mut);letter-spacing:.1em}
.st.row .mini14{display:none}
.st.row{flex-direction:row;align-items:center;gap:28px;flex-wrap:wrap}
.st.row .meter{width:140px;margin:6px 0 0}
.st.row .minis{grid-template-columns:repeat(4,auto);gap:4px 28px}
.chart{flex:1;min-height:0;position:relative;overflow:hidden}
.chart svg{position:absolute;left:0;top:0;overflow:visible}
.chart svg text{font-family:var(--fb);fill:var(--mut);font-size:11px}
.leg{font-size:11px;color:var(--mut);display:flex;gap:12px;letter-spacing:0;text-transform:none}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mo .mbody{flex:1;min-height:0;display:flex;gap:14px}
.mo .vis{position:relative;flex:1;min-width:0;min-height:0}
.mo .vis svg{position:absolute;left:0;top:0}
.mo .vis svg text{font-family:var(--fb);font-size:11px}
.ml{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:3px 14px;font-size:12.5px;align-content:start}
.ml li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:7px;align-items:center;min-width:0}
.ml li i{width:10px;height:10px;border-radius:3px}
.ml .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ml .v{font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
.ml.bars{grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:6px 18px}
.ml.bars li{grid-template-columns:10px minmax(0,1fr) auto;row-gap:3px}
.ml.bars .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.ml.bars .bar b{display:block;height:100%;border-radius:3px}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);align-items:center;justify-content:space-between;padding:18px 10px}
.vt .big{font:var(--hw) 44px/1 var(--fd);letter-spacing:var(--hls);color:var(--text);white-space:nowrap}
.vt .small{font:600 11px var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);z-index:7;padding:10px 18px;font:var(--hw) 18px var(--fd);color:var(--text);background:var(--surfS);border:1px solid var(--line);border-radius:var(--r);opacity:0;transition:.5s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
svg.defs{position:absolute;width:0;height:0}
@media (max-width:760px){
 body{overflow-x:hidden;overflow-y:auto;height:auto}
 html{height:auto}
 #app{display:flex!important;flex-direction:column;height:auto;min-height:100vh;padding:12px!important;gap:12px!important}
 .vt{display:none!important}
 .hd{padding:10px 14px}
 .nm{font-size:20px}
 .chart{flex:none;height:210px}
 .mini14{flex:none;height:70px}
 .mo .mbody{flex-direction:column!important}
 .mo .vis{flex:none;height:190px}
 .st.row{flex-direction:column;align-items:stretch;gap:0}
 .st.row .meter{width:auto;margin:10px 0 12px}
 .st.row .minis{grid-template-columns:1fr 1fr}
 .ml{grid-template-columns:1fr 1fr}
 .ml li{grid-template-columns:10px minmax(0,1fr) auto}
 .ml.bars{grid-template-columns:1fr}
 .ctl .sd{display:none}
}
</style>
<style id="gencss"></style>
</head>

<script>
"use strict";
/* ======================================================================
   REMIX ENGINE — seed 1..1000 -> one deterministic Token Burn design.
   Modules: backgrounds, palettes, counter styles, history charts,
   model breakdowns, layouts, type stacks, surfaces, radii, decor, split.
   ====================================================================== */
const Q = new URLSearchParams(location.search);
addEventListener("error", e => { if (document.body) document.body.dataset.err = (document.body.dataset.err || "") + e.message + "; " });
const PREVIEW = Q.has("preview"), CATALOG = Q.has("catalog");
let SEED = parseInt(Q.get("seed"), 10);
if (!(SEED >= 1 && SEED <= 1000)) {
  SEED = 1 + Math.floor(Math.random() * 1000);
  if (!CATALOG) { Q.set("seed", SEED); history.replaceState(null, "", "?" + Q.toString()); }
}
const GENRES = ["anime", "art", "creative", "standard"];
const genreOf = s => GENRES[Math.min(3, Math.floor((s - 1) / 250))];
const GI = g => GENRES.indexOf(g);

/* ---------- PRNG ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function hashInt(n, salt) { let h = (2166136261 ^ salt) >>> 0; h = Math.imul(h ^ n, 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return h >>> 0 }

/* ---------- colour ---------- */
const hx = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255] };
const toHex = a => "#" + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)) };
const lum = h => { const c = hx(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4) }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05) };
const rgba = (h, a) => { const c = hx(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})` };

/* ---------- PALETTES: name|family|bg|bg2|surf|text|ramp anchors (first = accent, second = accent2) ---------- */

const FAMW = { // genre weights per family: anime, art, creative, standard
  pastel: [6, 0, 0, 0], animenight: [4, 0, 1, 0], ukiyo: [1, 5, 0, 0], art: [0, 6, 0, 0], earthy: [0, 4, 0, 1],
  neon: [0, 0, 6, 0], retro: [1, 1, 5, 0], jewel: [1, 1, 2, 1], corplight: [0, 0, 0, 6], corpdark: [0, 0, 1, 5], mono: [0, 2, 1, 2]
};
const PALETTES = PAL_SRC.trim().split("\n").map(l => {
  const [name, fam, bg, bg2, surf, text, r] = l.split("|"); const anchors = r.split(",");
  return { name, fam, bg, bg2, surf, text, anchors, dark: lum(bg) < .18, w: FAMW[fam] };
});

/* ---------- MODULE TABLES (weights: anime, art, creative, standard; tone: a=any d=dark-only l=light-only) ---------- */
const BGS = [
  ["starfield", "Star", "d", [3, 1, 3, 2]], ["aurora", "Aurora", "a", [2, 1, 2, 3]], ["waves", "Tide", "a", [1, 2, 1, 2]],

  ["halftone", "Halftone", "a", [2, 2, 1, 1]], ["plasma", "Plasma", "a", [0, 0, 4, 0]], ["rain", "Rain", "a", [1, 1, 2, 1]],

  ["honeycomb", "Hive", "a", [1, 0, 2, 2]], ["circuit", "Circuit", "a", [0, 0, 3, 2]], ["mesh", "Gradient", "a", [2, 1, 1, 4]],
  ["lava", "Lava", "a", [1, 0, 3, 0]], ["fireflies", "Firefly", "d", [3, 1, 1, 0]], ["sunburst", "Sunburst", "a", [4, 0, 1, 0]],
  ["confetti", "Confetti", "a", [3, 0, 1, 0]], ["inkwash", "Mountain", "l", [1, 5, 0, 0]], ["terrazzo", "Terrazzo", "a", [0, 3, 1, 1]],
  ["blueprint", "Blueprint", "a", [0, 1, 1, 3]], ["chalk", "Chalk", "d", [1, 2, 1, 0]], ["neon", "Neon", "d", [0, 0, 5, 0]],
  ["pixel", "Valley", "a", [1, 0, 4, 0]], ["flow", "Swirl", "a", [0, 4, 2, 1]], ["bauhaus", "Form", "a", [0, 5, 1, 0]],
  ["seigaiha", "Wave", "a", [2, 4, 0, 0]], ["pointillist", "Point", "l", [0, 4, 0, 0]], ["polka", "Polka", "a", [5, 0, 1, 0]],
  ["dotgrid", "Grid", "a", [0, 0, 1, 5]], ["stripes", "Stripe", "a", [1, 1, 3, 0]]
].map(([k, word, tone, w]) => ({ k, word, tone, w }));

  const rawDt = (now - lastT) / 1000, dt = Math.min(.1, rawDt); lastT = now; tAcc += dt;
  checkFit();
  if (scene) { try { scene(tAcc, dt) } catch (e) { console.error(e); document.body.dataset.err = "scene " + P0.bg.k + ": " + e.message; scene = null } drawSparkles(tAcc) }
  if (DATA && counter) {
    const k = 1 - Math.exp(-Math.min(1.5, rawDt) * 1.6);
    display += (target - display) * k; if (target - display < 1) display = target;
    counter.set(TB.full(display));
    todayDisp += (DATA.today - todayDisp) * k; if (Math.abs(DATA.today - todayDisp) < 1) todayDisp = DATA.today;
    $("#today").textContent = TB.full(todayDisp); $("#tfull").textContent = `${TB.fmt(DATA.today)} so far · ${pct(DATA.today / Math.max(1, DATA.total))} of all time`;
    const step = 1e8, ms = Math.floor(display / step);
    if (lastMilestone && ms > lastMilestone && !PREVIEW) { const r = $("#ctr").getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 46); toast(`${TB.fmt(ms * step)} tokens passed`) }
    lastMilestone = ms;
  }
  if (fxParts.length) {
    fctx.clearRect(0, 0, S.W, S.H);
    for (let i = fxParts.length - 1; i >= 0; i--) { const p = fxParts[i]; p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt * .7; if (p.l <= 0) { fxParts.splice(i, 1); continue } fctx.globalAlpha = p.l; fctx.fillStyle = p.c; fctx.fillRect(p.x, p.y, p.s, p.s * 1.6) }
    fctx.globalAlpha = 1; if (!fxParts.length) fctx.clearRect(0, 0, S.W, S.H);
  }
}

/* ---------- boot ---------- */
genCSS();
document.title = PREVIEW ? P0.name : "Remix Engine · " + P0.name;
TB.onData(d => {
  DATA = d; D = prep(d); S.E = .35 + d.intensity * .9;
  if (!built) { build(); display = PREVIEW ? d.total : d.total * .985; todayDisp = d.today * .6; lastMilestone = Math.floor(display / 1e8) }
  target = d.total; counter.set(TB.full(display)); renderStatic(); fitCounter();
  if (!scene) { resize(); requestAnimationFrame(frame) }
});
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(resize, 120) });
/* keep charts sized to their boxes (fonts loading or the counter growing can change the grid) */
let roPending = false;
const ro = new ResizeObserver(() => { if (roPending || !built) return; roPending = true; requestAnimationFrame(() => { roPending = false; layoutCharts() }) });
const roC = new ResizeObserver(() => { if (built) fitCounter() });
const watchBoxes = () => { ["#chart", "#mini14", ".mo"].forEach(q => { const e = $(q); if (e) ro.observe(e) }); roC.observe($(".ctr-wrap")) };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (built) { fitCounter(); layoutCharts() } });
let fitTick = 0;
function checkFit() { if (!built || ++fitTick % 30) return; fitCounter() }
})();
</script>
