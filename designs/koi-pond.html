<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koi Pond</title>
<meta name="description" content="A sumi-e ink and gold-leaf koi pond: each model is a koi sized by its share, today's activity sets how lively they swim, new tokens send ripples, and the day history floats as lanterns along the edge.">
<style>
:root{--ink:#14110e;--wood:#c79a62;--wood2:#a87a45;--gold:#d9b765;--gold2:#a8853a;--paper:#efe6d2;--red:#b8352a;--jade:#2f5a3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0c1414;color:var(--paper);font-family:"Noto Serif CJK JP","Noto Serif JP","Iowan Old Style","Palatino Linotype",Georgia,serif;overflow-x:hidden}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.ui{position:relative;z-index:2;pointer-events:none;min-height:100vh}
.ui>*{pointer-events:auto}
.plaque{position:absolute;top:24px;left:24px;width:min(470px,calc(100vw - 32px));padding:20px 26px 16px;border-radius:10px;color:var(--ink);
  background:var(--wood);border:3px solid #5a3a1c;box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,230,190,.35),inset 0 0 26px rgba(70,40,10,.45)}
.plaque::before,.plaque::after{content:"";position:absolute;top:-22px;width:3px;height:24px;background:linear-gradient(#8a5a2b,#c79a62);border-radius:2px}
.plaque::before{left:58px}.plaque::after{right:58px}
.knot{position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #5a1a12}
.title{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.seal{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3db92,#c69c3e 60%,#8a6a22);color:#3a240a;display:grid;place-items:center;font-size:23px;font-weight:700;box-shadow:0 0 0 2px #5a3a1c,0 2px 4px rgba(0,0,0,.4)}
.title h1{margin:0;font-size:20px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;opacity:.85}
.title h1 small{display:block;font-size:10.5px;letter-spacing:.3em;opacity:.7;font-weight:400}
.total{font-size:clamp(30px,4.6vw,50px);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;
  text-shadow:0 0 1px rgba(20,17,14,.9),1px 1px 0 rgba(255,236,200,.35),0 0 6px rgba(40,20,5,.25)}
.total-l{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.65}
.row{display:flex;gap:18px;margin-top:10px;align-items:flex-end;flex-wrap:wrap}
.today b{font-size:22px;font-variant-numeric:tabular-nums}
.today span{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.65}
.live{flex:1;min-width:150px}
.split{height:9px;border-radius:5px;overflow:hidden;display:flex;background:rgba(20,17,14,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.split .m{background:linear-gradient(#2a2420,#14110e)}
.split .e{background:repeating-linear-gradient(-45deg,#b08a3e 0 3px,#e8cf85 3px 6px)}
.splitl{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums;opacity:.85}
.card{position:absolute;top:24px;right:24px;width:290px;padding:16px 18px 14px;border-radius:6px;color:var(--ink);background:rgba(239,230,210,.93);
  box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(168,133,58,.6),inset 0 0 0 5px rgba(239,230,210,.93),inset 0 0 0 6px rgba(168,133,58,.45)}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;display:flex;justify-content:space-between;color:#7a5a20}
.card h2 span{color:var(--ink);opacity:.5;letter-spacing:.12em}
.fish{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:center;font-size:13px}
.fish .am{text-align:right;font-variant-numeric:tabular-nums}
.fish .am small{opacity:.55;font-size:10.5px;margin-left:4px}
.fish svg{display:block}
.note{font-size:10.5px;line-height:1.5;opacity:.65;margin-top:10px;border-top:1px solid rgba(168,133,58,.5);padding-top:8px}
.demo{color:var(--red);font-weight:700}
.tip{position:fixed;z-index:5;pointer-events:none;background:rgba(239,230,210,.96);color:var(--ink);padding:6px 10px;border-radius:4px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;white-space:nowrap}
.tip b{color:#7a5a20}
.hint{position:absolute;left:28px;bottom:118px;font-size:11px;letter-spacing:.2em;color:rgba(217,183,101,.55);text-transform:uppercase;pointer-events:none}
@media (max-width:820px){
  .plaque{position:relative;top:auto;left:auto;margin:30px 16px 0;width:auto;padding:16px 18px 14px}
  .card{position:relative;top:auto;right:auto;margin:calc(100vh - 240px) 16px 40px;width:auto}
  .hint{display:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
  <div class="plaque">
    <i class="knot" style="left:53px"></i><i class="knot" style="right:53px"></i>
    <div class="title"><div class="seal">鯉</div><h1>Token Burn<small>the pond of tokens</small></h1></div>
    <div class="total" id="total">0</div>
    <div class="total-l">tokens burned, all time</div>
    <div class="row">
      <div class="today"><span>today</span><b id="today">0</b></div>
      <div class="today"><span>this week</span><b id="week">0</b></div>
      <div class="live">
        <div class="split"><div class="m" id="sm"></div><div class="e" id="se"></div></div>
        <div class="splitl"><span id="mv"></span><span id="ev"></span></div>
      </div>
    </div>
  </div>
  <div class="card">
    <h2>The koi <span>by model</span></h2>
    <div class="fish" id="fish"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="hint">tap the water to feed the koi</div>
</div>
<div class="tip" id="tip"></div>
<script src="tb-data.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
let W=0,H=0,dpr=1,D=null,bg=null,grainPat=null;
let shown=0,todayShown=0,live=.5,liveS=.5,milestone=0,lastByModel=null,lastToday=null;
const koi=[],ripples=[],pads=[],flecks=[],food=[];
let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

function hex(h){h=h.replace("#","");return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}
function rgba(a,al){const A=hex(a);return `rgba(${A[0]},${A[1]},${A[2]},${al})`}

/* ---------- background: ink wash, stones, gold leaf (cached) ---------- */
function buildBg(){
  bg=document.createElement("canvas");bg.width=W*dpr;bg.height=H*dpr;const x=bg.getContext("2d");x.scale(dpr,dpr);
  seed=7;
  const g=x.createRadialGradient(W*.5,H*.45,0,W*.5,H*.5,Math.max(W,H)*.75);
  g.addColorStop(0,"#1f3433");g.addColorStop(.55,"#142424");g.addColorStop(1,"#070c0c");x.fillStyle=g;x.fillRect(0,0,W,H);
  // ink-wash clouds
  for(let i=0;i<70;i++){const px=rnd()*W,py=rnd()*H,r=40+rnd()*220,dark=rnd()<.55;
    const gg=x.createRadialGradient(px,py,0,px,py,r);gg.addColorStop(0,dark?"rgba(4,8,8,.22)":"rgba(70,100,92,.09)");gg.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gg;x.fillRect(px-r,py-r,r*2,r*2)}
  // dry-brush ink strokes
  x.lineCap="round";
  for(let i=0;i<14;i++){let px=rnd()*W,py=rnd()*H,a=rnd()*6.28;x.strokeStyle=`rgba(0,0,0,${.12+rnd()*.12})`;
    for(let k=0;k<26;k++){x.lineWidth=(1-k/26)*(10+rnd()*18);const nx=px+Math.cos(a)*14,ny=py+Math.sin(a)*14;x.beginPath();x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();px=nx;py=ny;a+=(rnd()-.5)*.35}}
  // pond-edge stones with gold rims
  const stones=[[0,0,.22],[1,0,.12],[0,1,.16],[1,1,.2],[.5,1.02,.08],[1.02,.5,.07],[-.02,.55,.08]];
  for(const [sx,sy,sr] of stones){const r=Math.min(W,H)*sr,cx=sx*W,cy=sy*H;
    x.beginPath();for(let k=0;k<=24;k++){const a=k/24*6.283,rr=r*(.82+.18*Math.sin(a*3+sx*5)+.08*Math.sin(a*7+sy*3));x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.85)}x.closePath();
    const sg=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);sg.addColorStop(0,"#3b3a36");sg.addColorStop(1,"#121211");x.fillStyle=sg;x.fill();
    x.strokeStyle="rgba(217,183,101,.35)";x.lineWidth=1.5;x.stroke();
    x.strokeStyle="rgba(0,0,0,.35)";x.lineWidth=1;for(let k=0;k<6;k++){x.beginPath();x.arc(cx+(rnd()-.5)*r,cy+(rnd()-.5)*r,r*(.2+rnd()*.3),rnd()*6,rnd()*6+1.2);x.stroke()}}
  // fixed gold leaf flakes
  for(let i=0;i<130;i++){const px=rnd()*W,py=rnd()*H,s=1+rnd()*5;x.fillStyle=`rgba(${200+rnd()*40|0},${160+rnd()*40|0},${70+rnd()*40|0},${.25+rnd()*.45})`;
    x.beginPath();x.moveTo(px,py);for(let k=0;k<4;k++)x.lineTo(px+(rnd()-.5)*s*2,py+(rnd()-.5)*s*2);x.closePath();x.fill()}
  // paper grain
  const gr=document.createElement("canvas");gr.width=gr.height=256;const gx=gr.getContext("2d");
  for(let i=0;i<3500;i++){gx.fillStyle=`rgba(${rnd()<.5?"255,240,210":"0,0,0"},${.02+rnd()*.05})`;gx.fillRect(rnd()*256,rnd()*256,1+rnd(),1+rnd())}
  grainPat=ctx.createPattern(gr,"repeat");
  // drifting flecks + pads
  flecks.length=0;for(let i=0;i<60;i++)flecks.push({x:rnd()*W,y:rnd()*H,s:1.2+rnd()*3.2,a:rnd()*6.28,v:.2+rnd()*.6,ph:rnd()*6.28});
  pads.length=0;const np=Math.round(Math.min(13,6+W*H/120000));
  for(let i=0;i<np;i++){const r=Math.min(W,H)*(.035+rnd()*.05);pads.push({x:rnd()*W,y:H*.15+rnd()*H*.62,r,a:rnd()*6.28,notch:.25+rnd()*.25,vx:(rnd()-.5)*3,ph:rnd()*6.28,flower:rnd()<.3,shade:rnd()})}
}
function resize(){
  dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr|0;cv.height=H*dpr|0;buildBg();
  for(const k of koi){k.x=Math.min(W,k.x);k.y=Math.min(H,k.y)}
}
addEventListener("resize",resize);

/* ---------- koi ---------- */
const N=16;
function makeKoi(m,i){
  const L=Math.min(W,H)*(W<600?.13:.1)+Math.min(W,H)*(W<600?.32:.3)*Math.sqrt(m.share);
  const x=W*(.12+rnd()*.76),y=H*(.22+rnd()*.56),a=rnd()*6.28;
  const sp=[];for(let j=0;j<N;j++)sp.push([x-Math.cos(a)*j*L/N,y-Math.sin(a)*j*L/N]);
  const style=i%3;   // 0 kohaku: cream body, model-colour patches; 1 showa: colour body, cream + ink; 2 ogon: colour body, gold sheen
  const base=style===0?"#f1e8d6":mix(m.color,"#f1e8d6",.12);
  const patches=[];const pc=style===0?mix(m.color,"#000000",.05):"#f1e8d6";
  const np=4+(rnd()*4|0);
  for(let j=0;j<np;j++)patches.push({u:.04+rnd()*.72,v:(rnd()-.5)*1.3,r:.06+rnd()*.09,c:pc});
  if(style!==2)for(let j=0;j<3+(rnd()*4|0);j++)patches.push({u:.1+rnd()*.75,v:(rnd()-.5)*1.4,r:.02+rnd()*.035,c:"#15110d"});
  return {m,name:m.name,L,sp,a,x,y,ph:rnd()*6,spd:0,dash:0,tx:x,ty:y,style,base,patches,fin:mix(m.color,"#f1e8d6",.35),seg:L/N};
}
function syncKoi(d){
  const ms=d.models.slice(0,12);
  for(const m of ms){let k=koi.find(k=>k.name===m.name);if(!k){koi.push(makeKoi(m,koi.length))}else{k.m=m;const L=Math.min(W,H)*(W<600?.13:.1)+Math.min(W,H)*(W<600?.32:.3)*Math.sqrt(m.share);k.L=L;k.seg=L/N}}
}
function newTarget(k){
  const mx=W<600?40:80;
  const rs=[...document.querySelectorAll(".plaque,.card")].map(e=>e.getBoundingClientRect());
  for(let i=0;i<12;i++){k.tx=mx+Math.random()*(W-mx*2);k.ty=H*.12+Math.random()*(H*.68);
    if(!rs.some(r=>k.tx>r.left-40&&k.tx<r.right+40&&k.ty>r.top-40&&k.ty<r.bottom+40))break}
}
function stepKoi(k,dt,t){
  const lv=.35+liveS*1.1+k.dash;
  // target: food first
  let tx=k.tx,ty=k.ty,best=1e9;
  for(const f of food){const dd=Math.hypot(f.x-k.sp[0][0],f.y-k.sp[0][1]);if(dd<best){best=dd;tx=f.x;ty=f.y}}
  const hx=k.sp[0][0],hy=k.sp[0][1];
  if(best===1e9&&Math.hypot(tx-hx,ty-hy)<k.L*.6)newTarget(k);
  let want=Math.atan2(ty-hy,tx-hx);
  // gentle separation from other heads
  for(const o of koi){if(o===k)continue;const dx=hx-o.sp[0][0],dy=hy-o.sp[0][1],dd=Math.hypot(dx,dy);if(dd<(k.L+o.L)*.35&&dd>0){want+=.6*Math.sign(Math.sin(Math.atan2(dy,dx)-k.a))*(1-dd/((k.L+o.L)*.35))}}
  let diff=((want-k.a+Math.PI*3)%(Math.PI*2))-Math.PI;
  const turn=(1+lv)*.9;k.a+=Math.max(-turn*dt,Math.min(turn*dt,diff))+Math.sin(t*1.3+k.ph)*.004;
  const target=(18+42*lv)*(1-Math.min(.6,Math.abs(diff)/3))*(70/Math.max(70,k.L*.6))+(best<1e9?20:0);
  k.spd+=(target-k.spd)*Math.min(1,dt*2);
  k.dash=Math.max(0,k.dash-dt*.5);
  k.sp[0][0]+=Math.cos(k.a)*k.spd*dt;k.sp[0][1]+=Math.sin(k.a)*k.spd*dt;
  k.ph+=dt*(2+k.spd*.07);
  for(let j=1;j<N;j++){const p=k.sp[j],q=k.sp[j-1];let dx=p[0]-q[0],dy=p[1]-q[1];const l=Math.hypot(dx,dy)||1;p[0]=q[0]+dx/l*k.seg;p[1]=q[1]+dy/l*k.seg}
  // eat
  for(let i=food.length-1;i>=0;i--){if(Math.hypot(food[i].x-k.sp[0][0],food[i].y-k.sp[0][1])<k.L*.12+6){addRipple(food[i].x,food[i].y,k.L*.5,"#f3dfa0",.8);food.splice(i,1)}}
}
function wOf(u){return u<.22?.5+.5*Math.sin(u/.22*Math.PI/2):1-(u-.22)/.78*.86}
function koiGeom(k){
  // apply undulation (sideways wave travelling to the tail)
  const P=[],Nn=[],Wd=[];const amp=k.L*.045;
  for(let j=0;j<N;j++){const a=k.sp[Math.max(0,j-1)],b=k.sp[Math.min(N-1,j+1)];let dx=a[0]-b[0],dy=a[1]-b[1];const l=Math.hypot(dx,dy)||1;const nx=-dy/l,ny=dx/l;
    const off=Math.sin(k.ph-j*.42)*amp*Math.pow(j/(N-1),1.4);P.push([k.sp[j][0]+nx*off,k.sp[j][1]+ny*off]);Nn.push([nx,ny]);Wd.push(k.L*.135*wOf(j/(N-1)))}
  return {P,Nn,Wd};
}
function bodyPath(g,ox=0,oy=0){
  const {P,Nn,Wd}=g;ctx.beginPath();
  const h=P[0],d=[P[0][0]-P[1][0],P[0][1]-P[1][1]],dl=Math.hypot(d[0],d[1])||1;
  ctx.moveTo(P[0][0]+Nn[0][0]*Wd[0]+ox,P[0][1]+Nn[0][1]*Wd[0]+oy);
  for(let j=1;j<N;j++)ctx.lineTo(P[j][0]+Nn[j][0]*Wd[j]+ox,P[j][1]+Nn[j][1]*Wd[j]+oy);
  for(let j=N-1;j>=0;j--)ctx.lineTo(P[j][0]-Nn[j][0]*Wd[j]+ox,P[j][1]-Nn[j][1]*Wd[j]+oy);
  ctx.quadraticCurveTo(h[0]+d[0]/dl*Wd[0]*2.1+ox,h[1]+d[1]/dl*Wd[0]*2.1+oy,P[0][0]+Nn[0][0]*Wd[0]+ox,P[0][1]+Nn[0][1]*Wd[0]+oy);
  ctx.closePath();
}
function fin(px,py,ang,len,spread,col,al){
  ctx.beginPath();ctx.moveTo(px,py);
  ctx.quadraticCurveTo(px+Math.cos(ang-spread)*len*1.1,py+Math.sin(ang-spread)*len*1.1,px+Math.cos(ang)*len,py+Math.sin(ang)*len);
  ctx.quadraticCurveTo(px+Math.cos(ang+spread*.4)*len*.7,py+Math.sin(ang+spread*.4)*len*.7,px,py);
  ctx.fillStyle=rgba2(col,al);ctx.fill();ctx.strokeStyle="rgba(217,183,101,.55)";ctx.lineWidth=.8;ctx.stroke();
  ctx.strokeStyle="rgba(20,17,14,.25)";for(let i=1;i<4;i++){const a=ang-spread*.8+spread*i*.35;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(a)*len*.85,py+Math.sin(a)*len*.85);ctx.stroke()}
}
function rgba2(c,a){return c.startsWith("rgb(")?c.replace("rgb(","rgba(").replace(")",","+a+")"):rgba(c,a)}
function drawKoi(k,t){
  const g=koiGeom(k),{P,Nn,Wd}=g,L=k.L;
  // shadow on the pond floor
  bodyPath(g,L*.05,L*.07);ctx.fillStyle="rgba(0,0,0,.35)";ctx.fill();
  // tail
  const e=P[N-1],e2=P[N-3],ta=Math.atan2(e[1]-e2[1],e[0]-e2[0])+Math.sin(k.ph-N*.42)*.35;
  fin(e[0],e[1],ta-.32,L*.32,.6,k.fin,.45);fin(e[0],e[1],ta+.32,L*.32,-.6,k.fin,.45);
  // pectoral + pelvic fins
  const fl=Math.sin(k.ph*1.3)*.35;
  for(const [j,len] of [[3,L*.17],[8,L*.1]]){const ba=Math.atan2(P[j][1]-P[j-1][1],P[j][0]-P[j-1][0]);
    fin(P[j][0]+Nn[j][0]*Wd[j]*.8,P[j][1]+Nn[j][1]*Wd[j]*.8,ba+.95+fl,len,.45,k.fin,.5);
    fin(P[j][0]-Nn[j][0]*Wd[j]*.8,P[j][1]-Nn[j][1]*Wd[j]*.8,ba-.95-fl,len,-.45,k.fin,.5)}
  // body
  bodyPath(g);ctx.fillStyle=k.base;ctx.fill();
  ctx.save();ctx.clip();
  for(const p of k.patches){const j=Math.min(N-1,Math.round(p.u*(N-1))),x=P[j][0]+Nn[j][0]*Wd[j]*p.v,y=P[j][1]+Nn[j][1]*Wd[j]*p.v;
    const ang=Math.atan2(P[Math.max(0,j-1)][1]-P[Math.min(N-1,j+1)][1],P[Math.max(0,j-1)][0]-P[Math.min(N-1,j+1)][0]);
    ctx.beginPath();ctx.ellipse(x,y,L*p.r*1.5,L*p.r,ang,0,6.283);ctx.fillStyle=p.c;ctx.fill()}
  // scales: faint gold crescents
  ctx.strokeStyle=k.style===2?"rgba(255,226,140,.55)":"rgba(120,90,40,.22)";ctx.lineWidth=.7;
  for(let j=3;j<N-3;j+=1)for(let s=-1;s<=1;s++){const x=P[j][0]+Nn[j][0]*Wd[j]*s*.5,y=P[j][1]+Nn[j][1]*Wd[j]*s*.5,ang=Math.atan2(P[j-1][1]-P[j][1],P[j-1][0]-P[j][0]);
    ctx.beginPath();ctx.arc(x,y,Wd[j]*.22,ang+Math.PI-1,ang+Math.PI+1);ctx.stroke()}
  // spine sheen + edge shading
  const hx=P[0][0],hy=P[0][1];
  ctx.beginPath();ctx.moveTo(P[1][0],P[1][1]);for(let j=2;j<N-2;j++)ctx.lineTo(P[j][0],P[j][1]);ctx.strokeStyle=k.style===2?"rgba(255,236,170,.6)":"rgba(255,250,235,.28)";ctx.lineWidth=Wd[4]*.35;ctx.lineCap="round";ctx.stroke();
  ctx.restore();
  bodyPath(g);ctx.strokeStyle="rgba(20,17,14,.7)";ctx.lineWidth=1.2;ctx.stroke();
  // eyes
  const d=[P[0][0]-P[1][0],P[0][1]-P[1][1]],dl=Math.hypot(d[0],d[1])||1,fx=d[0]/dl,fy=d[1]/dl;
  for(const s of [-1,1]){ctx.beginPath();ctx.arc(hx+fx*Wd[0]*.9+Nn[0][0]*Wd[0]*.55*s,hy+fy*Wd[0]*.9+Nn[0][1]*Wd[0]*.55*s,Math.max(1.2,L*.012),0,6.283);ctx.fillStyle="#120e0a";ctx.fill()}
  k.hx=hx;k.hy=hy;k.cx=P[5][0];k.cy=P[5][1];
}
function drawTag(k){
  const x=k.cx,y=k.cy-k.L*.16-10;
  ctx.font=`${k.L>140?13:11}px "Noto Serif CJK JP",Georgia,serif`;ctx.textAlign="center";
  const s=k.name+"  "+TB.fmt(k.m.tokens);
  ctx.fillStyle="rgba(8,12,12,.55)";const w=ctx.measureText(s).width+12;ctx.fillRect(x-w/2,y-12,w,17);
  ctx.fillStyle="#e7cf88";ctx.fillText(s,x,y+1);
}

/* ---------- pads, ripples, lanterns ---------- */
function drawPad(p,t){
  const x=p.x+Math.sin(t*.2+p.ph)*4,y=p.y+Math.cos(t*.17+p.ph)*3,a=p.a+Math.sin(t*.15+p.ph)*.08,r=p.r;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.beginPath();ctx.ellipse(r*.08,r*.12,r,r*.96,0,0,6.283);ctx.fillStyle="rgba(0,0,0,.35)";ctx.fill();
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,p.notch,6.283-.05);ctx.closePath();
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,p.shade>.5?"#4d7a45":"#3f6b48");g.addColorStop(1,"#1d3a26");ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle="rgba(217,183,101,.6)";ctx.lineWidth=1.2;ctx.stroke();
  ctx.strokeStyle="rgba(190,220,160,.22)";ctx.lineWidth=1;
  for(let i=0;i<11;i++){const b=p.notch+.3+i*(6.0-p.notch)/11;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(b-.1)*r*.5,Math.sin(b-.1)*r*.5,Math.cos(b)*r*.92,Math.sin(b)*r*.92);ctx.stroke()}
  if(p.flower){
    for(let i=0;i<10;i++){const b=i/10*6.283+t*.03;ctx.beginPath();ctx.ellipse(Math.cos(b)*r*.25,Math.sin(b)*r*.25,r*.28,r*.1,b,0,6.283);ctx.fillStyle=i%2?"#f2c9cf":"#fbe6e4";ctx.fill();ctx.strokeStyle="rgba(150,60,80,.35)";ctx.stroke()}
    ctx.beginPath();ctx.arc(0,0,r*.12,0,6.283);ctx.fillStyle="#e8c35a";ctx.fill();
  }
  ctx.restore();
}
function addRipple(x,y,max,col,al){if(ripples.length<70)ripples.push({x,y,r:2,max,col:col||"#cfe3dc",al:al||.6,life:0})}
function drawRipples(dt){
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.life+=dt;r.r+=dt*(30+r.max*.35);const f=1-r.r/r.max;if(f<=0){ripples.splice(i,1);continue}
    for(let k=0;k<3;k++){const rr=r.r-k*8;if(rr<=0)continue;ctx.beginPath();ctx.ellipse(r.x,r.y,rr,rr*.92,0,0,6.283);ctx.strokeStyle=rgba2(r.col.startsWith("#")?mix(r.col,r.col,0):r.col,r.al*f*(1-k*.3));ctx.lineWidth=(1.6-k*.4);ctx.stroke()}}
}
let lanternHits=[];
function drawLanterns(t){
  lanternHits=[];if(!D||!D.days.length)return;
  const n=Math.min(D.days.length,W<600?14:Math.min(40,Math.floor((W-80)/30))),days=D.days.slice(-n);
  const y0=H-(W<600?44:58),x0=W<600?24:50,x1=W-(W<600?24:50),sp=(x1-x0)/Math.max(1,n-1||1);
  // golden cord
  ctx.beginPath();for(let i=0;i<=60;i++){const x=x0+(x1-x0)*i/60;ctx.lineTo(x,y0+Math.sin(x*.02+t*.6)*4)}ctx.strokeStyle="rgba(217,183,101,.45)";ctx.lineWidth=1.2;ctx.stroke();
  days.forEach((d,i)=>{
    const x=n===1?(x0+x1)/2:x0+sp*i,y=y0+Math.sin(x*.02+t*.6)*4+Math.sin(t*1.3+i)*1.5;
    const v=Math.pow(d.tokens/D.maxDay,.55),r=(W<600?5:6)+(W<600?11:14)*v,isT=d.d===D.todayISO,estF=d.est/d.tokens||0;
    const glow=r*(2.2+1.4*v)*(isT?1.2+.15*Math.sin(t*3):1);
    const gc=isT?"255,110,60":"255,196,110";
    const g=ctx.createRadialGradient(x,y,r*.3,x,y,glow);g.addColorStop(0,`rgba(${gc},${(.35+.4*v)*(1-.55*estF)})`);g.addColorStop(1,`rgba(${gc},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,glow,0,6.283);ctx.fill();
    // paper shade: lit (measured) or ink-washed grey (estimated)
    const lg=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
    if(isT){lg.addColorStop(0,"#ffd7a8");lg.addColorStop(1,"#c2402a")}else{lg.addColorStop(0,mix("#fff0cf","#9c9a90",estF*.8));lg.addColorStop(1,mix("#e39a45","#4d4b45",estF*.85))}
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle=lg;ctx.fill();
    ctx.strokeStyle="rgba(60,30,10,.55)";ctx.lineWidth=.8;for(let k=1;k<4;k++){ctx.beginPath();ctx.ellipse(x,y,r,r*k/4,0,0,6.283);ctx.stroke()}
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.strokeStyle="rgba(40,22,8,.9)";ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*.22,0,6.283);ctx.fillStyle="#2a1a0c";ctx.fill();
    lanternHits.push({x,y,r:Math.max(r,10),d});
  });
  ctx.font=`10.5px "Noto Serif CJK JP",Georgia,serif`;ctx.fillStyle="rgba(217,183,101,.75)";
  ctx.textAlign="left";ctx.fillText(days[0].d.slice(5).replace("-","/"),x0-6,y0+34);
  ctx.textAlign="right";ctx.fillText("today",x1+6,y0+34);
  ctx.textAlign="center";ctx.fillText(`lanterns · last ${n} days · grey = estimated`,(x0+x1)/2,y0+34);
}

/* ---------- loop ---------- */
let last=performance.now(),raf=0,surfAcc=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  liveS+=(live-liveS)*Math.min(1,dt*.7);
  if(D){
    shown+=(D.total-shown)*Math.min(1,dt*1.8);if(Math.abs(D.total-shown)<1)shown=D.total;
    todayShown+=(D.today-todayShown)*Math.min(1,dt*1.8);
    $("total").textContent=TB.full(shown);$("today").textContent=TB.full(todayShown);
    const m=Math.floor(shown/1e8);if(milestone&&m>milestone){for(let i=0;i<6;i++)setTimeout(()=>addRipple(W/2,H/2,Math.max(W,H)*.6,"#e7cf88",.9),i*260)}milestone=m;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(bg,0,0,W,H);
  // drifting light: soft caustic glows
  ctx.globalCompositeOperation="lighter";
  for(let i=0;i<5;i++){const x=W*(.5+.42*Math.sin(t*.05+i*1.7)),y=H*(.5+.38*Math.cos(t*.04+i*2.3)),r=Math.max(W,H)*.22;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,"rgba(60,90,80,.07)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
  // gold leaf flecks drifting & glinting
  for(const f of flecks){f.x+=Math.cos(f.a)*f.v*dt*6;f.y+=Math.sin(f.a)*f.v*dt*6;if(f.x<0)f.x+=W;if(f.x>W)f.x-=W;if(f.y<0)f.y+=H;if(f.y>H)f.y-=H;
    const gl=.35+.65*Math.max(0,Math.sin(t*1.5+f.ph));ctx.fillStyle=`rgba(230,195,110,${.25+.5*gl})`;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.ph+t*.2);ctx.fillRect(-f.s/2,-f.s/2,f.s,f.s*.6);ctx.restore()}
  ctx.globalCompositeOperation="source-over";
  // food
  for(let i=food.length-1;i>=0;i--){const f=food[i];f.life+=dt;if(f.life>14){food.splice(i,1);continue}ctx.beginPath();ctx.arc(f.x,f.y,2.6,0,6.283);ctx.fillStyle="#d9a85a";ctx.fill()}
  // koi, smaller ones deeper
  const order=koi.slice().sort((a,b)=>a.L-b.L);
  for(const k of order){stepKoi(k,dt,t);drawKoi(k,t)}
  // surfacing ripples: rate follows today's activity
  surfAcc+=dt*(.15+2.2*liveS*liveS);
  while(surfAcc>1){surfAcc--;const k=koi[Math.random()*koi.length|0];if(k&&k.hx)addRipple(k.hx,k.hy,k.L*.7+30,"#cfe3dc",.45)}
  drawRipples(dt);
  for(const p of pads)drawPad(p,t);
  for(const k of koi)drawTag(k);
  drawLanterns(t);
  ctx.globalAlpha=.8;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.78);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.5)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else{last=performance.now();raf=requestAnimationFrame(frame)}});

/* ---------- data ---------- */
function koiSvg(c,i){const b=i%3===0?"#f1e8d6":mix(c,"#f1e8d6",.12),p=i%3===0?c:"#f1e8d6";
  return `<svg viewBox="0 0 40 18" width="40" height="18"><path d="M30 9 L39 3 Q36 9 39 15 Z" fill="${mix(c,"#f1e8d6",.35)}" opacity=".8"/><ellipse cx="17" cy="9" rx="14" ry="5.5" fill="${b}" stroke="#14110e" stroke-width=".8"/><ellipse cx="13" cy="8" rx="4.5" ry="3" fill="${p}"/><ellipse cx="22" cy="10" rx="3.5" ry="2.4" fill="${p}"/><circle cx="6.5" cy="7.5" r=".9" fill="#14110e"/></svg>`}
TB.onData(d=>{
  const prev=D;D=d;live=d.intensity;
  if(!shown){shown=d.total*.997;todayShown=d.today*.9;if(!koi.length)seed=99}
  syncKoi(d);
  // new tokens since the last pull: ripple at each model's koi, and it darts
  const td=d.days.find(x=>x.d===d.todayISO),bm=td?td.byModel:{};
  if(lastByModel){for(const k of koi){const dlt=(bm[k.name]||0)-(lastByModel[k.name]||0);if(dlt>0&&k.hx){const s=Math.min(1,Math.log10(dlt)/8);for(let i=0;i<3;i++)setTimeout(()=>addRipple(k.hx,k.hy,k.L*(1+2*s)+40,"#f3dfa0",.75),i*220);k.dash=.4+s}}}
  lastByModel={...bm};
  const tot=d.measured+d.estimated||1;
  $("sm").style.width=(d.measured/tot*100)+"%";$("se").style.width=(d.estimated/tot*100)+"%";
  $("mv").textContent="measured "+TB.fmt(d.measured);$("ev").textContent="estimated "+TB.fmt(d.estimated);
  $("week").textContent=TB.fmt(d.week);
  $("fish").innerHTML=d.models.slice(0,12).map((m,i)=>`<div>${koiSvg(m.color,koi.findIndex(k=>k.name===m.name))}</div><div>${m.name}</div><div class="am">${TB.fmt(m.tokens)}<small>${(m.share*100).toFixed(m.share<.01?2:1)}%</small></div>`).join("");
  $("note").innerHTML=`Each koi is a model, sized by its share. Today's ${TB.fmt(d.today)} tokens set how lively they swim (${Math.round(d.intensity*100)}%); new tokens make ripples. Lanterns float one per day, brighter for bigger days. Since ${d.firstDay}.${d.demo?' <span class="demo">Sample data, server not reachable.</span>':""}`;
});

/* ---------- interaction ---------- */
const tip=$("tip");
cv.addEventListener("pointerdown",e=>{for(let i=0;i<5;i++)food.push({x:e.clientX+(Math.random()-.5)*26,y:e.clientY+(Math.random()-.5)*26,life:0});addRipple(e.clientX,e.clientY,120,"#e7cf88",.8)});
cv.addEventListener("pointermove",e=>{
  const x=e.clientX,y=e.clientY;
  const l=lanternHits.find(h=>Math.hypot(h.x-x,h.y-y)<h.r+4);
  const k=!l&&koi.find(k=>k.cx&&Math.hypot(k.cx-x,k.cy-y)<k.L*.3);
  if(l)tip.innerHTML=`<b>${l.d.d}</b> · ${TB.full(l.d.tokens)} tokens${l.d.est?` · ${TB.fmt(l.d.est)} estimated`:""}`;
  else if(k)tip.innerHTML=`<b>${k.name}</b> · ${TB.full(k.m.tokens)} tokens · ${(k.m.share*100).toFixed(1)}%`;
  if(l||k){tip.style.opacity=1;tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,x+14)+"px";tip.style.top=Math.max(4,y-34)+"px"}else tip.style.opacity=0;
});
resize();raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
