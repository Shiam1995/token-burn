<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token City</title>
<meta name="description" content="An isometric city that grows one building per day of token burn: height is tokens, colour and roof come from the dominant model, estimated days stand as grey old town, traffic follows today's intensity and the sky follows your local time.">
<style>
:root{--ink:#eef3fb;--dim:#9fb0c8;--glass:rgba(14,22,40,.72);--line:rgba(160,190,230,.22);--acc:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#0e1526;color:var(--ink);font-family:"DejaVu Sans","Segoe UI",Arial,sans-serif;overflow-x:hidden}
#stage{position:fixed;inset:0}
#city{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.hud{position:fixed;top:14px;right:14px;bottom:14px;width:318px;display:flex;flex-direction:column;gap:10px;z-index:2;overflow:auto;scrollbar-width:thin}
.card{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px 13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.big{font:700 26px/1.15 "DejaVu Sans Mono",monospace;letter-spacing:.01em;margin-top:3px;white-space:nowrap}
.mid{font:700 15px "DejaVu Sans Mono",monospace}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-size:12.5px}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.models{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.m{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.m .sw{width:12px;height:12px;border-radius:3px}
.m .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .v{font:600 12px "DejaVu Sans Mono",monospace;color:#dfe7f3}
.m .sb{grid-column:2/4;height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:-2px}
.m .sb i{display:block;height:100%;border-radius:2px}
#strip{width:100%;height:70px;display:block;margin-top:6px;cursor:crosshair}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px;color:var(--dim);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.title{position:fixed;left:18px;top:14px;z-index:2;pointer-events:none}
.title h1{margin:0;font-size:22px;letter-spacing:.2em;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.title div{font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tip{position:fixed;pointer-events:none;z-index:5;background:rgba(8,12,24,.92);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;display:none;max-width:260px}
.tip b{font-family:"DejaVu Sans Mono",monospace}
.demo{color:var(--acc)}
@media (max-width:820px){
  #stage{position:relative;height:440px}
  .hud{position:static;width:auto;margin:0 16px 16px;overflow:visible}
  .title{position:absolute}
  .title h1{font-size:17px}
}
</style>
</head>
<body>
<div id="stage"><canvas id="city"></canvas>
  <div class="title"><h1>TOKEN CITY</h1><div id="sub">one building per day</div></div>
</div>
<aside class="hud">
  <div class="card">
    <div class="k"><span>Built today</span><span id="clock">--:--</span></div>
    <div class="big" id="today">0</div>
    <div class="row"><span style="color:var(--dim)">Total (billboard)</span><span class="mid" id="total">0</span></div>
    <div class="row"><span style="color:var(--dim)">This week</span><span class="mid" id="week">0</span></div>
    <div class="row"><span style="color:var(--dim)">Traffic</span><span class="mid" id="traffic">–</span></div>
  </div>
  <div class="card">
    <div class="k"><span>Measured vs estimated</span><span id="mpct"></span></div>
    <div class="bar"><i id="bm" style="background:linear-gradient(90deg,#ffd166,#ff9f43)"></i><i id="be" style="background:repeating-linear-gradient(45deg,#8b929c 0 4px,#6b717a 4px 8px)"></i></div>
    <div class="row"><span>Measured <b class="mid" id="meas"></b></span><span>Est. <b class="mid" id="est"></b></span></div>
  </div>
  <div class="card">
    <div class="k"><span>Districts · models</span><span id="nm"></span></div>
    <div class="models" id="models"></div>
  </div>
  <div class="card">
    <div class="k"><span>Building permits · daily</span><span id="nd"></span></div>
    <canvas id="strip"></canvas>
    <div class="legend">
      <span style="--c:#8d939b">grey = estimated</span><span style="--c:#ff4d4d">beacon = biggest day</span>
      <span style="--c:#ffd166">flag = billion crossed</span><span style="--c:#7fd3ff">crane = today</span>
    </div>
  </div>
</aside>
<div class="tip" id="tip"></div>
<script src="tb-data.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $("city"), g = cv.getContext("2d");
let D = null, W = 0, H = 0, dpr = 1, TW = 60, ox = 0, oy = 0, G = 13;
let lots = [], blds = [], cars = [], peds = [], sparks = [];
let ground = null, groundL = -1, shownTotal = 0, fromTotal = 0, tStart = 0, born = 0, hover = null, stripHover = null;
const hex = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (a, f) => [a[0] * f, a[1] * f, a[2] * f];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };

// ---------- sky / time of day ----------
function daylight(t = new Date()) {
  const q = /[?&]hour=([\d.]+)/.exec(location.search);
  const hr = q ? +q[1] : t.getHours() + t.getMinutes() / 60 + t.getSeconds() / 3600;
  const alt = Math.sin((hr - 6) / 12 * Math.PI);           // >0 between 06:00 and 18:00
  const L = clamp((alt + .12) / .45, 0, 1);
  const warm = clamp(1 - Math.abs(alt) / .3, 0, 1);
  return { hr, alt, L: L * L * (3 - 2 * L), warm };
}
let TOD = daylight();
const NIGHT_TINT = [40, 52, 96];
function lightC(c) { // apply daylight + dusk warmth to a base colour
  const L = TOD.L, k = .32 + .68 * L;
  let o = mix(mul(c, k), mul(NIGHT_TINT, .9), (1 - L) * .35);
  if (TOD.warm > 0) o = mix(o, [255, 150, 90], TOD.warm * .16);

}

// ---------- layout ----------
function iso(i, j) { return [ox + (i - j) * TW / 2, oy + (i + j) * TW / 4]; }
function layout() {
  const narrow = innerWidth <= 820;
  if (narrow) { const tw = Math.min((innerWidth - 4) * .96 / G, 64); $("stage").style.height = Math.round(118 + tw * (G / 2 + 2.4) + 24) + "px"; } else $("stage").style.height = "";
  const r = cv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2);
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
  const hudW = narrow ? 0 : 340, aw = W - hudW - 20, top = narrow ? 118 : 150, ah = H - top - 20;
  TW = Math.min(aw * .96 / G, ah / (G / 2 + 2.4));
  ox = (narrow ? W / 2 : (W - hudW) / 2 + 10); oy = top + Math.max(0, (ah - TW * (G / 2 + 2.4)) * .5) + TW * 1.6;
  groundL = -1; blds.forEach(b => b.spr = null);
  drawStrip();
}

// ---------- city model ----------
function buildCity(d) {
  const n = d.days.length + 5;                         // a few empty lots for tomorrow
  const B = Math.max(2, Math.ceil(Math.sqrt(n / 4)));
  G = 3 * B + 1;
  lots = [];
  for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) if (i % 3 && j % 3) lots.push({ i, j });
  lots.sort((a, b) => (a.i + a.j) - (b.i + b.j) || a.i - b.i);
  // newest should be the front-most lot; skip the very back if we have spare
  const spare = lots.length - n, startAt = Math.max(0, Math.floor(spare / 2));
  const rank = {}; d.models.forEach((m, k) => rank[m.name] = k);
  let cum = 0, nextB = 1e9;
  blds = d.days.map((x, k) => {
    const L = lots[startAt + k], top = Object.entries(x.byModel).sort((a, b) => b[1] - a[1])[0] || ["Other", 0];
    cum += x.tokens; let flag = 0; while (cum >= nextB) { flag = nextB; nextB += 1e9; }
    const est = x.est > x.tokens / 2;
    return { ...L, k, day: x, est, model: top[0], color: hex(est ? "#8d939b" : TB.color(top[0])), roof: est ? 4 : (rank[top[0]] || 0) % 4,
      hf: Math.sqrt(x.tokens / d.maxDay), seed: k * 7.3 + 1, flag, peak: x.tokens === d.maxDay, today: x.d === d.todayISO, spr: null };
  });

  blds.empty = lots.slice(startAt + d.days.length, startAt + n);

  blds.park = lots.slice(0, startAt);

}
function makeTraffic() {
  const I = D ? D.intensity : .4;
  const nc = Math.round(5 + I * 34), np = Math.round(8 + I * 46);
  const roads = []; for (let k = 0; k < G; k += 3) roads.push(k);
  const palette = ["#ff5d5d", "#ffd166", "#f4f4f4", "#5ec8ff", "#7be07b", "#c08bff", "#ff9f43"];
  while (cars.length < nc) { const ax = Math.random() < .5, dir = Math.random() < .5 ? 1 : -1;
    cars.push({ ax, line: roads[(Math.random() * roads.length) | 0], t: Math.random() * G, dir, v: (.6 + Math.random() * .7), c: hex(palette[(Math.random() * palette.length) | 0]) }); }
  cars.length = nc;
  while (peds.length < np) { const ax = Math.random() < .5;
    peds.push({ ax, line: roads[(Math.random() * roads.length) | 0] + (Math.random() < .5 ? .42 : -.42), t: Math.random() * G, dir: Math.random() < .5 ? 1 : -1, v: .12 + Math.random() * .15, c: hex(palette[(Math.random() * palette.length) | 0]), ph: Math.random() * 6 }); }
  peds.length = np;
}

// ---------- drawing primitives ----------
function quad(c, p) { c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let k = 1; k < p.length; k++) c.lineTo(p[k][0], p[k][1]); c.closePath(); }
// box with front-bottom vertex at (X,Y), side s (tiles), height h px; returns key points
function box(c, X, Y, s, h, col, opt = {}) {

  const up = p => [p[0], p[1] - h];
  const lc = lightC(col), left = mul(lc, .78), right = mul(lc, .6), top = mul(lc, 1.08);
  c.fillStyle = css(left); quad(c, [Dv, C, up(C), up(Dv)]); c.fill();
  c.fillStyle = css(right); quad(c, [C, Bv, up(Bv), up(C)]); c.fill();
  c.fillStyle = css(top.map(v => Math.min(255, v))); quad(c, [up(A), up(Bv), up(C), up(Dv)]); c.fill();
  if (opt.edge !== false) { c.strokeStyle = "rgba(0,0,0,.18)"; c.lineWidth = 1; c.beginPath(); c.moveTo(...up(C)); c.lineTo(...C); c.stroke(); }
  return { C, Dv, Bv, A, up };
}
function windows(c, P0, P1, h, b, faceShade) {

  if (floors < 1) return;

  const night = 1 - TOD.L, act = clamp(b.day.tokens / D.maxDay * 1.4 + .15, .15, 1);
  for (let f = 0; f < floors; f++) for (let u = 0; u < cols; u++) {
    const r = hash(b.seed * 31 + f * 7.1 + u * 3.3 + faceShade);
    const lit = night > .25 && r < act * (b.est ? .35 : 1);
    let col;
    if (lit) col = r < .1 ? [255, 236, 190] : r < .55 ? [255, 214, 120] : [255, 190, 110];
    else col = mix([150, 190, 225], [20, 26, 44], night * .9 + (b.est ? .25 : 0));
    const a = lit ? .95 : .55 * (1 - faceShade * .3);
    const u0 = (u + .22) / cols, u1 = (u + .78) / cols, v0 = fh * (f + .55), v1 = v0 + fh * .5;
    const P = (uu, vv) => [P0[0] + (P1[0] - P0[0]) * uu, P0[1] + (P1[1] - P0[1]) * uu - vv];
    c.fillStyle = css(col, a); quad(c, [P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)]); c.fill();
  }
}
function buildingSprite(b) {
  const hmax = TW * 2.25, h = Math.max(TW * .12, b.hf * hmax), s = .76;
  const pad = TW * .6, w = Math.ceil(s * TW + pad * 2), hh = Math.ceil(h + s * TW / 2 + TW * 1.4);
  const o = document.createElement("canvas"); o.width = Math.ceil(w * dpr); o.height = Math.ceil(hh * dpr);
  const c = o.getContext("2d"); c.scale(dpr, dpr);
  const X = w / 2, Y = hh - 2;
  // shadow on the ground
  c.fillStyle = `rgba(0,0,0,${.12 + .1 * TOD.L})`; quad(c, [[X, Y], [X + s * TW / 2 + h * .25, Y - s * TW / 4 + h * .05], [X + h * .25, Y - s * TW / 2 + h * .05], [X - s * TW / 2, Y - s * TW / 4]]); c.fill();
  const k = box(c, X, Y, s, h, b.color);
  windows(c, k.Dv, k.C, h, b, 0); windows(c, k.C, k.Bv, h, b, 1);
  const top = k.up(k.C), cx = top[0], cy = top[1] - s * TW / 4;            // centre of roof
  const roofC = mix(b.color, [60, 60, 66], .45);
  if (b.roof === 0) { // flat + water tank
    const t = box(c, cx + TW * .08, cy + TW * .1, .2, TW * .18, [120, 98, 80], { edge: false });
    c.fillStyle = css(lightC([90, 72, 60])); c.beginPath(); c.moveTo(...t.up(t.Dv)); c.lineTo(cx + TW * .08, cy + TW * .1 - TW * .18 - TW * .12); c.lineTo(...t.up(t.Bv)); c.fill();
  } else if (b.roof === 1) { // pyramid
    const ap = [cx, cy - TW * .42];
    c.fillStyle = css(mul(lightC(roofC), .95)); quad(c, [k.up(k.Dv), k.up(k.C), ap]); c.fill();
    c.fillStyle = css(mul(lightC(roofC), .7)); quad(c, [k.up(k.C), k.up(k.Bv), ap]); c.fill();
  } else if (b.roof === 2) { // setback tower
    const s2 = .42, h2 = Math.max(TW * .2, h * .22);
    const k2 = box(c, cx, cy + s2 * TW / 4, s2, h2, mix(b.color, [255, 255, 255], .15));
    windows(c, k2.Dv, k2.C, h2, b, 0);
  } else if (b.roof === 3) { // antenna
    c.strokeStyle = css(lightC([200, 205, 215])); c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx, cy - TW * .55); c.stroke();
    c.beginPath(); c.moveTo(cx - TW * .08, cy - TW * .3); c.lineTo(cx + TW * .08, cy - TW * .3); c.stroke();
  } else { // old town: pitched brick roof + chimney
    const ap1 = [k.up(k.Dv)[0] + (cx - k.up(k.Dv)[0]) * .5, cy - TW * .22];
    c.fillStyle = css(lightC([110, 84, 74])); quad(c, [k.up(k.Dv), k.up(k.C), [cx + (k.up(k.C)[0] - cx) * .0, cy - TW * .22 + TW * .19], ap1]); c.fill();
    c.fillStyle = css(lightC([86, 64, 58])); quad(c, [k.up(k.C), k.up(k.Bv), [cx + TW * .19, cy - TW * .22], [cx, cy - TW * .22 + TW * .19]]); c.fill();
    c.fillStyle = css(lightC([96, 80, 72])); c.fillRect(cx + TW * .05, cy - TW * .38, TW * .06, TW * .16);
  }
  if (b.flag) { // billion flag
    const fx = k.up(k.Dv)[0] + TW * .06, fy = k.up(k.Dv)[1];
    c.strokeStyle = "#ddd"; c.lineWidth = 1.2; c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx, fy - TW * .5); c.stroke();
    c.fillStyle = "#ffd166"; quad(c, [[fx, fy - TW * .5], [fx + TW * .26, fy - TW * .43], [fx, fy - TW * .36]]); c.fill();
  }
  return { o, w, hh, X, Y, h, roofY: Y - h - s * TW / 2 };
}
function drawGround() {
  const o = ground || (ground = document.createElement("canvas")); o.width = cv.width; o.height = cv.height;
  const c = o.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // sky
  const L = TOD.L, sky = c.createLinearGradient(0, 0, 0, H);
  const topC = mix([6, 10, 30], [74, 150, 226], L), botC = mix([26, 34, 72], [196, 228, 248], L);
  sky.addColorStop(0, css(topC)); sky.addColorStop(1, css(mix(botC, [255, 150, 100], TOD.warm * .55)));

  if (L < .6) { let s = 11; c.fillStyle = "#fff"; for (let k = 0; k < 140; k++) { s = s * 16807 % 2147483647; const x = s % 10007 / 10007 * W; s = s * 16807 % 2147483647; const y = s % 10007 / 10007 * H * .7; c.globalAlpha = (1 - L / .6) * (.3 + hash(k) * .7); c.fillRect(x, y, hash(k + 9) < .1 ? 2 : 1, hash(k + 9) < .1 ? 2 : 1); } c.globalAlpha = 1; }

  const ang = (TOD.hr - 6) / 12 * Math.PI, R = Math.min(W, H) * .45, cx = W * .5 - Math.cos(ang) * R * 1.1, cy = H * .62 - Math.sin(ang) * R;
  if (TOD.alt > -.15) { const gr = c.createRadialGradient(cx, cy, 0, cx, cy, 60); gr.addColorStop(0, "rgba(255,240,200,1)"); gr.addColorStop(.25, "rgba(255,220,150,.9)"); gr.addColorStop(1, "rgba(255,200,120,0)"); c.fillStyle = gr; c.beginPath(); c.arc(cx, cy, 60, 0, 7); c.fill(); }
  else { const nf = ((TOD.hr + 6) % 24) / 12, mx = W * (.06 + .2 * clamp(nf, 0, 1)), my = Math.max(70, H * .2) - Math.sin(clamp(nf, 0, 1) * Math.PI) * 20; c.fillStyle = "#f1efe2"; c.beginPath(); c.arc(mx, my, 16, 0, 7); c.fill(); c.fillStyle = css(topC); c.beginPath(); c.arc(mx + 6, my - 4, 14, 0, 7); c.fill(); }
  // island slab
  const [lx, ly] = iso(0, G), [fx, fy] = iso(G, G), [rx, ry] = iso(G, 0), [bx, by] = iso(0, 0), th = TW * .45;
  c.fillStyle = css(lightC([84, 66, 52])); quad(c, [[lx, ly], [fx, fy], [fx, fy + th], [lx, ly + th]]); c.fill();
  c.fillStyle = css(lightC([62, 48, 38])); quad(c, [[fx, fy], [rx, ry], [rx, ry + th], [fx, fy + th]]); c.fill();
  // tiles
  const grass = lightC([112, 168, 96]), grass2 = lightC([98, 152, 86]), road = lightC([70, 74, 84]), walk = lightC([170, 168, 160]);
  for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
    const isRoad = i % 3 === 0 || j % 3 === 0;
    const p = [iso(i, j), iso(i + 1, j), iso(i + 1, j + 1), iso(i, j + 1)];
    c.fillStyle = css(isRoad ? road : (i + j) % 2 ? grass : grass2); quad(c, p); c.fill();
    if (!isRoad) { // sidewalk rim
      c.strokeStyle = css(walk, .9); c.lineWidth = Math.max(1, TW * .05); quad(c, [iso(i + .04, j + .04), iso(i + .96, j + .04), iso(i + .96, j + .96), iso(i + .04, j + .96)]); c.stroke();
    } else if (!(i % 3 === 0 && j % 3 === 0)) { // lane dashes
      c.strokeStyle = css(lightC([240, 220, 150]), .7); c.lineWidth = Math.max(1, TW * .025);
      c.beginPath(); if (i % 3 === 0) { c.moveTo(...iso(i + .5, j + .3)); c.lineTo(...iso(i + .5, j + .7)); } else { c.moveTo(...iso(i + .3, j + .5)); c.lineTo(...iso(i + .7, j + .5)); } c.stroke();
    }
  }
  // park on spare back lots
  for (const p of blds.park || []) for (let t = 0; t < 4; t++) {
    const [x, y] = iso(p.i + .25 + (t % 2) * .5, p.j + .25 + (t >> 1) * .5);
    c.fillStyle = css(lightC([60, 120, 70])); c.beginPath(); c.arc(x, y - TW * .14, TW * .12, 0, 7); c.fill();
  }
  // empty lots: foundations
  for (const p of blds.empty || []) { c.fillStyle = css(lightC([150, 130, 100])); quad(c, [iso(p.i + .14, p.j + .14), iso(p.i + .86, p.j + .14), iso(p.i + .86, p.j + .86), iso(p.i + .14, p.j + .86)]); c.fill();
    c.strokeStyle = css(lightC([230, 160, 60]), .8); c.setLineDash([3, 3]); c.lineWidth = 1; c.stroke(); c.setLineDash([]); }
  // street lamps glow at night
  if (L < .7) { c.globalCompositeOperation = "lighter";
    for (let i = 0; i <= G; i += 3) for (let j = 0; j <= G; j += 3) { const [x, y] = iso(i + .5, j + .5), r = TW * .9; const gr = c.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,200,120,${.35 * (1 - L / .7)})`); gr.addColorStop(1, "rgba(255,200,120,0)"); c.fillStyle = gr; c.fillRect(x - r, y - r, r * 2, r * 2); }
    c.globalCompositeOperation = "source-over"; }
  groundL = TOD.L + TOD.warm * 10;
}
function billboard(t) {
  if (!D) return;
  const narrow = innerWidth <= 820;
  const [bx, by] = iso(0, 0), bw = Math.min(narrow ? W * .82 : 500, W * .9), bh = narrow ? 62 : 92;
  const x0 = bx - bw / 2, y0 = by - TW * 1.3 - bh - (narrow ? 0 : 10);
  // poles
  g.fillStyle = css(lightC([70, 74, 84])); g.fillRect(bx - bw * .3, y0 + bh, 5, by - y0 - bh); g.fillRect(bx + bw * .3 - 5, y0 + bh, 5, by - y0 - bh);
  g.fillStyle = "#121722"; g.fillRect(x0 - 5, y0 - 5, bw + 10, bh + 10);
  const gr = g.createLinearGradient(0, y0, 0, y0 + bh); gr.addColorStop(0, "#0b1020"); gr.addColorStop(1, "#18213a");
  g.fillStyle = gr; g.fillRect(x0, y0, bw, bh);
  // lamps over the board
  for (let k = 0; k < 4; k++) { const lx = x0 + bw * (k + .5) / 4; g.fillStyle = "#333a48"; g.fillRect(lx - 5, y0 - 10, 10, 5);
    const lg = g.createLinearGradient(0, y0, 0, y0 + bh * .6); lg.addColorStop(0, `rgba(255,240,200,${.12 + .2 * (1 - TOD.L)})`); lg.addColorStop(1, "rgba(255,240,200,0)"); g.fillStyle = lg; g.beginPath(); g.moveTo(lx - 4, y0); g.lineTo(lx + bw * .14, y0 + bh * .6); g.lineTo(lx - bw * .14, y0 + bh * .6); g.fill(); }
  g.textAlign = "center"; g.fillStyle = "#9fb0c8"; g.font = `700 ${narrow ? 10 : 12}px DejaVu Sans, sans-serif`;
  g.fillText("T O T A L   T O K E N S   B U R N E D", bx, y0 + (narrow ? 15 : 21));
  const fs = Math.min(narrow ? 30 : 46, bw / 9.2);
  g.font = `700 ${fs}px DejaVu Sans Mono, monospace`;
  g.shadowColor = "#ffb347"; g.shadowBlur = 14; g.fillStyle = "#ffd98a";
  g.fillText(TB.full(shownTotal), bx, y0 + bh - (narrow ? 12 : 18));
  g.shadowBlur = 0;
  // chasing bulbs, speed by intensity
  const nb = Math.floor(bw / 14), ph = (t / (260 - D.intensity * 180)) | 0;
  for (let k = 0; k < nb; k++) { const on = (k + ph) % 3 === 0; g.fillStyle = on ? "#ffe9a8" : "#5a4a2a"; g.fillRect(x0 + k * bw / nb + 3, y0 - 3, 3, 3); g.fillRect(x0 + k * bw / nb + 3, y0 + bh, 3, 3); }
}
function car(c, X, Y, ax, col, dir) {
  const s = TW * .15, l = TW * .24;
  const ev = ax ? [TW / 2, TW / 4] : [-TW / 2, TW / 4];            // along-road unit
  const sv = ax ? [-TW / 2, TW / 4] : [TW / 2, TW / 4];            // across-road unit
  const P = (a, b, z = 0) => [X + ev[0] * a + sv[0] * b, Y + ev[1] * a + sv[1] * b - z];
  const a0 = -l / TW / 1, a1 = l / TW, b0 = -s / TW / 1.4, b1 = s / TW / 1.4, z = TW * .1;
  const lc = lightC(col);
  c.fillStyle = "rgba(0,0,0,.25)"; quad(c, [P(a0, b0), P(a1, b0), P(a1, b1), P(a0, b1)]); c.fill();
  c.fillStyle = css(mul(lc, .7)); quad(c, [P(a0, b1), P(a1, b1), P(a1, b1, z), P(a0, b1, z)]); c.fill();
  c.fillStyle = css(mul(lc, .55)); quad(c, [P(a1, b0), P(a1, b1), P(a1, b1, z), P(a1, b0, z)]); c.fill();
  c.fillStyle = css(lc); quad(c, [P(a0, b0, z), P(a1, b0, z), P(a1, b1, z), P(a0, b1, z)]); c.fill();
  if (TOD.L < .6) { const hx = P(dir > 0 ? a1 : a0, 0, z * .5), r = TW * .35; c.globalCompositeOperation = "lighter";
    const gr = c.createRadialGradient(hx[0], hx[1], 0, hx[0], hx[1], r); gr.addColorStop(0, `rgba(255,240,190,${.5 * (1 - TOD.L / .6)})`); gr.addColorStop(1, "rgba(255,240,190,0)"); c.fillStyle = gr; c.fillRect(hx[0] - r, hx[1] - r, r * 2, r * 2); c.globalCompositeOperation = "source-over"; }
}
function crane(c, b, sp, x, y, t) {
  const mx = x + TW * .38, my = y - TW * .19, top = sp.roofY - (y - sp.Y) - TW * .9 + (y - sp.Y);
  const mtop = y - sp.h - TW * 1.0;
  c.strokeStyle = "#ffcf3f"; c.lineWidth = 2; c.beginPath(); c.moveTo(mx, my); c.lineTo(mx, mtop); c.stroke();
  for (let yy = my; yy > mtop + 6; yy -= 7) { c.beginPath(); c.moveTo(mx - 3, yy); c.lineTo(mx + 3, yy - 7); c.lineWidth = .8; c.stroke(); }
  const jx = mx - TW * .9, jy = mtop + TW * .1; c.lineWidth = 2; c.beginPath(); c.moveTo(mx + TW * .25, mtop + TW * .05); c.lineTo(jx, jy); c.stroke();
  const sw = Math.sin(t * .0012) * .3 + .55, hx = mx + (jx - mx) * sw, hy = mtop + (jy - mtop) * sw;
  c.lineWidth = 1; c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx, hy + TW * .45); c.stroke(); c.fillStyle = "#7fd3ff"; c.fillRect(hx - 3, hy + TW * .45, 6, 4);
  if (((t / 600) | 0) % 2) { c.fillStyle = "#ff4d4d"; c.beginPath(); c.arc(mx, mtop - 2, 2.5, 0, 7); c.fill(); }
}

// ---------- frame ----------
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden || !D) return;
  const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
  const tt = new Date(); if (now - (frame.tod || 0) > 5000) { frame.tod = now; TOD = daylight(tt); }
  if (Math.abs(TOD.L + TOD.warm * 10 - groundL) > .02) { drawGround(); blds.forEach(b => b.spr = null); }
  // ticking total
  const k = Math.min(1, (now - tStart) / (fromTotal ? 20000 : 3500)), e = 1 - Math.pow(1 - k, 3);
  shownTotal = fromTotal + (D.total - fromTotal) * e;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.drawImage(ground, 0, 0, W, H);
  billboard(now);
  // drawables sorted by depth
  const items = [];
  const grow = (now - born) / 1000, N = blds.length;
  for (const b of blds) items.push({ z: b.i + b.j + 1.6, b });
  const I = D.intensity;
  for (const c of cars) { c.t += c.dir * c.v * (.6 + I * 1.6) * dt; if (c.t > G) c.t -= G; if (c.t < 0) c.t += G;
    const lane = c.line + .5 + (c.dir > 0 ? .2 : -.2) * (c.ax ? 1 : -1); const i = c.ax ? c.t : lane, j = c.ax ? lane : c.t; items.push({ z: i + j, car: c, i, j }); }
  for (const p of peds) { p.t += p.dir * p.v * (.5 + I) * dt; if (p.t > G) p.t -= G; if (p.t < 0) p.t += G;
    const i = p.ax ? p.t : p.line + .5, j = p.ax ? p.line + .5 : p.t; items.push({ z: i + j, ped: p, i, j }); }
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    if (it.b) {
      const b = it.b, start = (b.k / Math.max(1, N)) * 3.2, p = clamp((grow - start) / .7, 0, 1); if (p <= 0) continue;
      if (!b.spr) b.spr = buildingSprite(b);
      const sp = b.spr, [fx, fy] = iso(b.i + .88, b.j + .88), x = fx - sp.X, y = fy - sp.Y;
      const rise = (1 - (1 - p) * (1 - p) * (1 - p)) ;
      g.save();
      if (p < 1) { // rising out of the ground: clip above the footprint's lower edges
        const s = .76; g.beginPath(); g.moveTo(fx - s * TW / 2, fy - s * TW / 4); g.lineTo(fx, fy); g.lineTo(fx + s * TW / 2, fy - s * TW / 4); g.lineTo(fx + s * TW / 2, -9999); g.lineTo(fx - s * TW / 2, -9999); g.closePath(); g.clip();
      }
      g.drawImage(sp.o, x, y + (sp.h + TW * .6) * (1 - rise), sp.w, sp.hh);
      g.restore();
      b.box = { x: fx - .38 * TW, y: fy - sp.h - .38 * TW - 4, w: .76 * TW, h: sp.h + .38 * TW + 4 };
      if (b.peak && p >= 1) { const on = Math.sin(now * .006) > 0; g.fillStyle = on ? "#ff4d4d" : "#6a1d1d"; g.beginPath(); g.arc(fx, sp.roofY + y + (b.roof === 1 ? -TW * .42 : b.roof === 3 ? -TW * .55 : -TW * .05), 3.2, 0, 7); g.fill();
        if (on) { g.globalCompositeOperation = "lighter"; const r = 22, cx = fx, cy = sp.roofY + y - TW * .3; const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, "rgba(255,70,70,.45)"); gr.addColorStop(1, "rgba(255,70,70,0)"); g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2); g.globalCompositeOperation = "source-over"; } }
      if (b.today && p >= 1) crane(g, b, sp, fx, fy, now);
      if (hover === b || stripHover === b) { g.strokeStyle = "#fff"; g.lineWidth = 2; const s = .76, hh = sp.h; g.beginPath(); g.moveTo(fx - s * TW / 2, fy - s * TW / 4); g.lineTo(fx, fy); g.lineTo(fx + s * TW / 2, fy - s * TW / 4); g.lineTo(fx + s * TW / 2, fy - s * TW / 4 - hh); g.lineTo(fx, fy - s * TW / 2 - hh); g.lineTo(fx - s * TW / 2, fy - s * TW / 4 - hh); g.closePath(); g.stroke(); }
    } else if (it.car) { const [x, y] = iso(it.i, it.j); car(g, x, y, it.car.ax, it.car.c, it.car.dir * (it.car.ax ? 1 : -1)); }
    else { const p = it.ped, [x, y] = iso(it.i, it.j), bob = Math.abs(Math.sin(now * .008 + p.ph)) * 1.2, s = Math.max(.7, TW / 60);
      g.fillStyle = css(lightC(p.c)); g.fillRect(x - 1.2 * s, y - 6 * s - bob, 2.4 * s, 4 * s); g.fillStyle = css(lightC([240, 205, 170])); g.fillRect(x - 1 * s, y - 8.2 * s - bob, 2 * s, 2 * s); }
  }
  // fireworks for milestones
  if (sparks.length) { g.globalCompositeOperation = "lighter";
    for (const s of sparks) { s.vy += 30 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; g.fillStyle = css(s.c, clamp(s.life, 0, 1)); g.fillRect(s.x, s.y, 2.2, 2.2); }
    sparks = sparks.filter(s => s.life > 0); g.globalCompositeOperation = "source-over"; }
  if (now - (frame.ui || 0) > 250) { frame.ui = now; $("total").textContent = TB.full(shownTotal);
    $("clock").textContent = String(tt.getHours()).padStart(2, "0") + ":" + String(tt.getMinutes()).padStart(2, "0") + (TOD.L > .5 ? " · day" : TOD.L > .05 ? " · dusk" : " · night"); }
}
function fireworks(n = 5) {
  const [bx, by] = iso(0, 0);
  for (let f = 0; f < n; f++) { const cx = bx + (Math.random() - .5) * 420, cy = by - TW * 2 - 60 - Math.random() * 90, col = hex(["#ffd166", "#ff6b6b", "#7fd3ff", "#b39dff", "#7be07b"][f % 5]);
    setTimeout(() => { for (let k = 0; k < 70; k++) { const a = Math.random() * 7, v = 40 + Math.random() * 90; sparks.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.2 + Math.random() * .8, c: col }); } if (sparks.length > 600) sparks.splice(0, sparks.length - 600); }, f * 450); }
}

// ---------- HUD ----------
function hud(d) {
  $("today").textContent = TB.full(d.today);
  $("week").textContent = TB.full(d.week);
  $("traffic").textContent = cars.length + " cars · " + Math.round(d.intensity * 100) + "%";
  const t = d.measured + d.estimated || 1;
  $("bm").style.width = d.measured / t * 100 + "%"; $("be").style.width = d.estimated / t * 100 + "%";
  $("meas").textContent = TB.fmt(d.measured); $("est").textContent = TB.fmt(d.estimated); $("mpct").textContent = Math.round(d.measured / t * 100) + "% measured";
  $("nm").textContent = d.models.length; $("nd").textContent = d.days.length + " buildings";
  $("sub").innerHTML = (d.demo ? '<span class="demo">sample data · </span>' : "") + "one building per day · since " + d.firstDay;
  const roofs = ["flat + tank", "pyramid", "setback", "antenna"];
  $("models").innerHTML = d.models.map((m, k) => `<div class="m" title="roof: ${roofs[k % 4]}"><span class="sw" style="background:${m.color}"></span><span class="n">${m.name}</span><span class="v">${TB.fmt(m.tokens)} · ${(m.share * 100).toFixed(m.share < .01 ? 2 : 1)}%</span><div class="sb"><i style="width:${Math.max(1, m.share * 100)}%;background:${m.color}"></i></div></div>`).join("");
}
let stripBars = [];
function drawStrip() {
  const c = $("strip"), r = c.getBoundingClientRect(); if (!D || !r.width) return;
  const p = Math.min(devicePixelRatio || 1, 2); c.width = r.width * p; c.height = r.height * p;
  const x = c.getContext("2d"); x.setTransform(p, 0, 0, p, 0, 0); x.clearRect(0, 0, r.width, r.height);
  const n = blds.length, bw = r.width / Math.max(1, n); stripBars = [];
  blds.forEach((b, k) => { const h = Math.max(2, b.hf * (r.height - 12)); x.fillStyle = css(b.color, stripHover === b || hover === b ? 1 : .85);
    x.fillRect(k * bw + .5, r.height - 10 - h, Math.max(1, bw - 1), h); if (b.flag) { x.fillStyle = "#ffd166"; x.fillRect(k * bw, 0, Math.max(1, bw - 1), 3); } stripBars.push([k * bw, bw, b]); });
  x.fillStyle = "#9fb0c8"; x.font = "9px DejaVu Sans"; x.textAlign = "left"; x.fillText(blds[0] ? blds[0].day.d.slice(5) : "", 0, r.height - 1); x.textAlign = "right"; x.fillText("today", r.width, r.height - 1);
}
function tipFor(b, ex, ey) {
  const tip = $("tip"); if (!b) { tip.style.display = "none"; return; }
  const ents = Object.entries(b.day.byModel).sort((a, c) => c[1] - a[1]).slice(0, 4).map(([k, v]) => `<span style="color:${TB.color(k)}">■</span> ${k} ${TB.fmt(v)}`).join("<br>");
  tip.innerHTML = `<b>${b.day.d}</b>${b.today ? " · today" : ""}<br><b>${TB.full(b.day.tokens)}</b> tokens${b.est ? " · estimated" : ""}${b.flag ? `<br>★ crossed ${TB.fmt(b.flag)}` : ""}${b.peak ? "<br>● biggest day" : ""}<br>${ents}`;
  tip.style.display = "block"; tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, ex + 14) + "px"; tip.style.top = Math.max(8, ey - tip.offsetHeight - 8) + "px";
}
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let hit = null; for (let k = blds.length - 1; k >= 0; k--) { const b = blds[k], bx = b.box; if (bx && mx > bx.x && mx < bx.x + bx.w && my > bx.y && my < bx.y + bx.h) { if (!hit || b.i + b.j > hit.i + hit.j) hit = b; } }
  if (hit !== hover) { hover = hit; drawStrip(); } tipFor(hit, e.clientX, e.clientY);
});
cv.addEventListener("mouseleave", () => { hover = null; tipFor(null); drawStrip(); });
$("strip").addEventListener("mousemove", e => { const r = e.target.getBoundingClientRect(), mx = e.clientX - r.left, s = stripBars.find(s => mx >= s[0] && mx < s[0] + s[1]);
  stripHover = s ? s[2] : null; drawStrip(); tipFor(stripHover, e.clientX, e.clientY); });
$("strip").addEventListener("mouseleave", () => { stripHover = null; tipFor(null); drawStrip(); });

TB.onData(d => {
  const first = !D, prevT = D ? D.total : 0, prevN = D ? D.days.length : -1, prevMax = D ? D.maxDay : 0, prevToday = D ? D.today : -1;
  fromTotal = first ? 0 : shownTotal; tStart = performance.now(); D = d;
  if (first || prevN !== d.days.length || prevMax !== d.maxDay || prevToday !== d.today) { const keepBorn = !first; buildCity(d); layout(); if (!keepBorn) born = performance.now(); else born = performance.now() - 1e5; }
  makeTraffic(); hud(d); drawStrip();
  if (!first && Math.floor(d.total / 1e9) > Math.floor(prevT / 1e9)) fireworks(7);
  if (first && blds.length && blds[blds.length - 1].today && blds[blds.length - 1].flag) setTimeout(() => fireworks(5), 3800);
});
addEventListener("resize", () => { clearTimeout(layout.t); layout.t = setTimeout(() => { if (D) layout(); }, 100); });
requestAnimationFrame(frame);
})();
</script>
