    if (c.top) lines.push({ s: "TOP " + c.top.name.toUpperCase() + " " + Math.round(c.segs[0].v / c.t * 100) + "%", st: sty(FS, c.top.ramp[3]), icon: c.top.coin.mini });
    if (c.segs.length > 1) lines.push({ s: c.segs.length + " MODELS", st: sty(FS, C.lab) });
    lines.push(c.est ? { s: "ESTIMATED " + short(c.estV), st: sty(FS, C.violet) } : { s: "MEASURED", st: sty(FS, RAMPS.orange[3]) });
    if (c.bill) lines.push({ s: "CROSSED " + c.bill + " BILLION", st: sty(FS, C.gold) });
  } else lines.push({ s: "REST DAY", st: sty(FS, C.lab) });
  tipBox(lines, px, py);
}
function drawTooltip() {
  if (!hover || !D) return; const { x, y } = hover;
  if (L.mm && x >= L.mm.x && x < L.mm.x + L.mm.w && y >= L.mm.y - 4 && y < L.mm.y + L.mm.h + 8) { const i = clamp(Math.floor((x - L.mm.x) / L.mm.bw), 0, L.mm.nd - 1); dayTip(world[NLEAD + i], x, L.mm.y - 2);
    X.fillStyle = WHITE; const bx = L.mm.x + Math.floor(i * L.mm.bw); X.fillRect(bx, L.mm.y + L.mm.h + 1, Math.max(1, Math.floor(L.mm.bw)), 1); return }
  if (L.inv && x >= L.inv.x && y >= L.inv.y && y < L.inv.y + (L.inv.cols === 2 ? 5 : L.inv.n) * L.inv.rowH + 2) {
    const col = L.inv.cols === 2 ? clamp(Math.floor((x - L.inv.x) / (L.inv.colW + 8)), 0, 1) : 0, row = Math.floor((y - L.inv.y) / L.inv.rowH), i = L.inv.cols === 2 ? col * 5 + row : row, m = MODELS[i];
    if (m) { const pct = m.share * 100, ps = pct >= 1 ? Math.round(pct) + "%" : pct >= .1 ? pct.toFixed(1) + "%" : "<0.1%";
      tipBox([{ s: m.name.toUpperCase(), st: sty(FP, m.ramp[3]), icon: m.coin.mini }, { s: TB.full(m.tokens), st: sty(FP, C.cream) }, { s: "SHARE " + ps + "  RANK " + (i + 1), st: sty(FS, "#d0d7e2") },
        { s: m.days + " DAYS ACTIVE", st: sty(FS, C.lab) }, { s: "BEST " + (m.bestD ? dateLabel(m.bestD) + " " + short(m.best) : "-"), st: sty(FS, C.gold) }, { s: "WEEK " + short(m.week), st: sty(FS, C.cyan) }], x, y) }
    return }
  if (y >= L.pf.y && y < L.pf.y + L.pf.h) { const k = Math.floor((x + Math.round(scroll)) / CW), c = world[k]; if (c && c.kind === "day") {
    const cx = k * CW - Math.round(scroll); X.fillStyle = WHITE; for (let yy = L.base - c.h - 1; yy < L.base; yy += 2) { X.fillRect(cx - 1, yy, 1, 1); X.fillRect(cx + CW, yy, 1, 1) }
    dayTip(c, x, Math.min(y, L.base - c.h)) } }
}

/* =====================================================================
   FRAME
   ===================================================================== */
const PT = {}; const pt = (k, t0) => { PT[k] = (PT[k] || 0) * .95 + (performance.now() - t0) * .05 };
function draw(now) {
  if (!LY || !LY.c) return; let t0 = performance.now();
  X.save(); X.beginPath(); X.rect(0, L.pf.y, LW, L.pf.h); X.clip();
  X.translate(shk[0], shk[1]);
  drawBack(now); pt('back', t0); t0 = performance.now();
  if (D && HERO) {
    drawTerrain(now); pt('terr', t0); t0 = performance.now();
    drawFight(now);
    drawHero(now);
    drawFx(now);
    blitStrip(LY.c.fg, 1.3, L.pf.y + L.pf.h);
    drawTitle(now);
    drawBanner(now);
  } else drawLoading(now);
  X.restore();
  X.save(); X.beginPath(); X.rect(0, L.pf.y, LW, L.pf.h); X.clip(); drawIris(); X.restore();
  t0 = performance.now(); if (fontsReady) { drawTopHud(now); pt('top', t0); t0 = performance.now(); drawBotHud(now); pt('bot', t0) } else { bevelBar(0, L.hudH, true); bevelBar(LH - L.botH, L.botH, false) }
  if (D) drawFlyers(now);
  if (fontsReady) drawTooltip();
  if (flash > 0 && !RM) { X.fillStyle = flash > .12 ? WHITE : C.cream; X.globalAlpha = Math.min(.55, flash * 2); X.fillRect(0, L.pf.y, LW, L.pf.h); X.globalAlpha = 1 }
}
function drawLoading(now) {
  // ground + an idle hero + spinning coin; no numbers until data arrives
  patFill(LY.c.gtP, 0, L.base, LW, L.gH, 0, L.base);
  if (HERO) { const fr = HERO.idle[Math.floor(now * 2) % 2]; X.drawImage(fr.c, L.heroSX - 11, L.base - 26) }
  const cs = coinSet("gold"); X.drawImage(cs.frames[Math.floor(now * 10) % 6], L.heroSX + 14, L.base - 40 + Math.round(Math.sin(now * 4) * 2));
  if (fontsReady) { const dots = ".".repeat(Math.floor(now * 3) % 4); T("NOW LOADING" + dots, Math.round(LW / 2 - TW("NOW LOADING...", sty(FP, C.cream, INK)) / 2), L.pf.y + Math.round(L.pf.h * .35), sty(FP, C.cream, INK)) }
}
function present() {
  SCX.imageSmoothingEnabled = false;
  SCX.fillStyle = "#07050b"; SCX.fillRect(0, 0, screen.width, screen.height);
  SCX.drawImage(src, 0, 0, LW, LH, OX, OY, LW * S, LH * S);
  if (crt && scanC) {
    SCX.drawImage(scanC, OX, OY);
    // bloom: bright-pass at 1/4 res, added on top with bilinear upscale (the art grid underneath stays untouched)
    if ((bloomTick++ & 1) === 0) { const bx = bloomS.getContext("2d"), w = bloomS.width, h = bloomS.height; bx.imageSmoothingEnabled = true; bx.drawImage(src, 0, 0, w, h);
      const im = bx.getImageData(0, 0, w, h), d = im.data;
      for (let i = 0; i < d.length; i += 4) { const l = Math.max(d[i], d[i + 1], d[i + 2]), v = l > 150 ? ((l - 150) / 105) ** 2 : 0; d[i] *= v; d[i + 1] *= v; d[i + 2] *= v }
      bx.putImageData(im, 0, 0) }
    SCX.save(); SCX.globalCompositeOperation = "lighter"; SCX.globalAlpha = .32; SCX.imageSmoothingEnabled = true; SCX.drawImage(bloomS, OX - S, OY - S, LW * S + 2 * S, LH * S + 2 * S); SCX.restore();
  }
}

/* ---------------- debug sprite sheet (?sheet=1) ---------------- */
function drawSheet() {
  X.fillStyle = "#5590f0"; X.fillRect(0, 0, LW, LH);
  let x = 4; const fr = [...HERO.idle, HERO.blink, ...HERO.run, HERO.jump, HERO.fall, HERO.land, HERO.cheer];
  fr.forEach(f => { X.drawImage(f.c, x, 4); x += 24 });
  x = 4; HERO.ball.forEach(b => { X.drawImage(b, x, 36); x += 18 });
  coinSet("gold").frames.forEach(c => { X.drawImage(c, x, 38); x += 12 });
  coinSet("violet").frames.forEach(c => { X.drawImage(c, x, 38); x += 12 });
  BUG.forEach(b => { X.drawImage(b, x, 38); x += 16 }); X.drawImage(BUGDEAD, x, 38); x += 16;
  X.drawImage(BOSS.n[0], 4, 56); X.drawImage(BOSS.n[1], 56, 56); X.drawImage(BOSS.f, 108, 56); X.drawImage(MINI.n[0], 160, 60); X.drawImage(MINI.n[1], 184, 60);
  let y = 104; for (const rn of ["orange", "violet", "teal", "pink"]) { const p = brickPat(rn); X.drawImage(p.mc, 4, y); X.drawImage(p.mc, 20, y); X.drawImage(p.ec, 40, y); X.drawImage(p.ec, 48, y); X.drawImage(coinSet(rn).mini, 60, y); y += 10 }
  if (fontsReady) { T("HI-SCORE 0123456789", 80, 104, sty(FP, C.red)); T("SILKSCREEN LABEL 1.65B", 80, 114, sty(FS, C.lab)); T("8,160,839,326", 80, 124, sty(FB, GOLD, INK, "#5a1020")) }
}

/* =====================================================================
   INPUT + BOOT
   ===================================================================== */
const toArt = e => ({ x: Math.floor((e.clientX * DPR - OX) / S), y: Math.floor((e.clientY * DPR - OY) / S) });
screen.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const p = toArt(e); hover = { x: p.x, y: p.y, t: performance.now() / 1000 } } });
screen.addEventListener("pointerleave", () => { hover = null });
screen.addEventListener("pointerdown", e => {
  const p = toArt(e);
  if (L.crtBtn && p.x >= L.crtBtn.x - 2 && p.x < L.crtBtn.x + L.crtBtn.w + 2 && p.y >= L.crtBtn.y - 2 && p.y < L.crtBtn.y + L.crtBtn.h + 2) { toggleCrt(); return }
  if (L.mm && p.x >= L.mm.x && p.x < L.mm.x + L.mm.w && p.y >= L.mm.y - 4 && p.y < L.mm.y + L.mm.h + 2 && e.pointerType === "mouse") { warpTo = NLEAD + clamp(Math.floor((p.x - L.mm.x) / L.mm.bw), 0, L.mm.nd - 1); return }
  if (e.pointerType !== "mouse") { hover = { x: p.x, y: p.y, t: performance.now() / 1000, touch: true }; return }
  if (p.y >= L.pf.y && p.y < L.pf.y + L.pf.h) jump();
});
function jump() { if (hero.ground && !fight && D) { hero.vy = -Math.sqrt(2 * 900 * 44); hero.ground = false; hero.big = false; puff(L.heroSX, hero.y, 4, [RAMPS.grey[3], RAMPS.grey[2]]) } }
function toggleCrt() { crt = !crt; store.set("tb-arcade-crt", crt ? "1" : "0") }
addEventListener("keydown", e => {
  if (e.key === "c" || e.key === "C") toggleCrt();
  else if (e.key === " " || e.key === "ArrowUp") { jump(); e.preventDefault() }
  else if (e.key === "ArrowRight") fastF = .4;
});
addEventListener("resize", resize);
buildHero(); buildBug(); buildFurnaces();
resize();
loadFonts().then(() => { if (D) layout() });
TB.onData(d => { const h = +SP.get("hold") || 0; if (h && !D) setTimeout(() => onData(d), h); else onData(d) });
setInterval(() => recolor(false), 30000);
if (SP.has("boss")) setTimeout(() => { if (D) startFight(Math.max(1, Math.floor(D.total / 1e9)), true) }, +SP.get("boss") || 4500);
if (SP.has("fanfare")) setTimeout(() => { if (D) fanfare(Math.floor(D.total / 1e8)) }, +SP.get("fanfare") || 4500);
if (SP.has("at")) { const at = +SP.get("at"); const w = () => { if (D) warpTo = NLEAD + clamp(at, 0, todayK - NLEAD); else setTimeout(w, 200) }; setTimeout(w, 300) }
if (DBG) window.__tb = { get hero() { return hero }, get world() { return world }, get fight() { return fight }, startFight, fanfare, onData };
let last = performance.now() / 1000;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  if (document.hidden) { last = now; return }
  const dt = Math.min(.05, now - last); last = now;
  if (SP.has("sheet")) { drawSheet(); present(); return }
  if (SP.has("cycle")) { const h = (now * 1.5) % 24; SP.set("hour", h.toFixed(2)); recolor(false) }
  const a0 = performance.now(); const SK = SP.get('skip') || ''; update(RM ? dt * .7 : dt, now); pt('upd', a0); if (!SK.includes('d')) draw(now); const a1 = performance.now(); if (!SK.includes('p')) present(); pt('pres', a1);
  if (DBG) { const st = window.__perf || (window.__perf = { n: 0, cpu: 0, t0: now }); st.n++; st.cpu += performance.now() - a0; st.fps = st.n / (now - st.t0); document.title = 'fps ' + st.fps.toFixed(1) + ' cpu ' + (st.cpu / st.n).toFixed(2) + ' ' + Object.entries(PT).map(([k, v]) => k + ':' + v.toFixed(2)).join(' ') }
}
requestAnimationFrame(frame);
})();
</script>
