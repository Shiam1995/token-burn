<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starburn Compact HUD</title>
<meta name="description" content="Tokki's transformation compact as a token HUD: the gold locket opens on a crystal per model filled by its share, a mana ring charges with today against your best day, spell cards per model, and a chibi Tokki who is sleepy or bouncing depending on today's burn.">
<style>
:root{
  --ink:#5a3260;--ink2:#8e6a96;--gold:#d9a53a;--gold2:#ffe08a;--pink:#ff8fc0;--lav:#c9b3ff;--sky:#a9dcff;
  --card:rgba(255,255,255,.72);--f:"Noto Sans CJK JP","Noto Sans","DejaVu Sans",system-ui,sans-serif;--serif:"C059","Noto Serif","DejaVu Serif",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:13px/1.35 var(--f);overflow-x:hidden;
  background:radial-gradient(circle at 20% 10%,#ffe6f3 0,transparent 45%),radial-gradient(circle at 90% 80%,#e3f2ff 0,transparent 45%),
  radial-gradient(#ffd3e9 1.6px,transparent 2px) 0 0/26px 26px,radial-gradient(#e9dcff 1.6px,transparent 2px) 13px 13px/26px 26px,#fff6fb}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:12px 16px 14px;display:grid;gap:10px;
  grid-template-columns:250px minmax(0,1fr) minmax(290px,330px);grid-template-areas:"top top top" "cards compact side"}
@media (max-width:1180px){#app{grid-template-columns:minmax(0,1fr) minmax(280px,330px);grid-template-areas:"top top" "compact side" "cards cards"}}
/* ---------- title banner ---------- */
.banner{grid-area:top;position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:8px 70px 8px;border-radius:26px;
  background:linear-gradient(180deg,#fffdf6,#fff0f8);border:3px solid transparent;
  background-clip:padding-box;box-shadow:0 0 0 2px #f3c76a,0 0 0 6px #fff,0 0 0 7.5px #f0c4dc,0 10px 30px rgba(200,100,160,.18)}
.banner .orn{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px}
.banner .orn.l{left:10px}.banner .orn.r{right:10px;transform:scaleX(-1)}
.ttl{text-align:center}
.ttl .k{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:14px;letter-spacing:.06em}
.ttl .k b{color:#e0569a;font-style:normal;font-family:var(--f);letter-spacing:.2em;font-size:11.5px}
#total{font-weight:900;font-size:clamp(30px,5.4vw,68px);line-height:1.04;white-space:nowrap;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff9d0 0%,#ffd060 30%,#e59a2a 52%,#ffcf6a 64%,#ff9fc8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 0 1px #b06a1a) drop-shadow(0 4px 10px rgba(220,130,60,.3))}
.ttl .u{font-weight:900;letter-spacing:.3em;color:#e0569a;font-size:13px;margin-top:-2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:#fff;border:1.5px solid #f6d3e6;border-radius:14px;padding:4px 12px;text-align:center;min-width:96px}
.stat small{display:block;color:var(--ink2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat.t b{color:#e0569a}
#demo{display:none;color:#c03;font-weight:700;font-size:11px}
/* ---------- compact ---------- */
.compactWrap{grid-area:compact;position:relative;overflow-x:clip;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.stageC{position:relative;perspective:calc(var(--S)*5.5);width:var(--S);height:var(--S);margin-top:calc(var(--S)*.34)}
#body,#lid{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lidBox{position:absolute;inset:0;transform-origin:50% 3.2%;transform-style:preserve-3d;cursor:pointer}
.lidBox svg{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:visible}
#lidBack{transform:rotateX(180deg)}
#body{cursor:pointer}
.hint{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2);font-family:var(--serif);font-style:italic}
#tipC{position:absolute;pointer-events:none;background:#fff;border:1.5px solid #f3c76a;border-radius:10px;padding:4px 9px;font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(160,60,130,.2);display:none;z-index:5}
/* ---------- side ---------- */
.side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-height:0}
.panel{background:var(--card);border-radius:20px;padding:10px 12px;border:2px solid #fff;box-shadow:0 0 0 1.5px #f3d08a,0 8px 22px rgba(190,100,160,.14);position:relative}
.panel h2{margin:0 0 6px;font:italic 600 14px var(--serif);color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.panel h2 span{font:500 11px var(--f);color:var(--ink2);font-style:normal}
.chibiP{display:grid;grid-template-columns:150px 1fr;gap:6px;align-items:center}
#chibi{width:150px;height:170px;overflow:visible}
.bubble{position:relative;background:#fff;border:2px solid #ffc6e0;border-radius:16px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.bubble:before{content:"";position:absolute;left:-9px;top:26px;border:8px solid transparent;border-right-color:#ffc6e0;border-left:0}
.bubble b{color:#e0569a}
.mood{display:inline-block;margin-top:5px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff8fc0,#c9a0ff);border-radius:999px;padding:2px 9px}
.meter{display:flex;gap:4px;margin-top:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:#f1e2f3}
.meter i.on{background:linear-gradient(90deg,#ff8fc0,#ffcf6a)}
#cal{width:100%;display:block}
.calLeg{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);margin-top:3px}
.split{display:flex;height:16px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1.5px #f3c76a,0 0 0 3.5px #fff}
.split div{transition:flex-basis 1s}
.split .m{background:linear-gradient(180deg,#ffd7ea,#ff9cc8)}
.split .e{background:repeating-linear-gradient(135deg,#efe6ff 0 5px,#d8c8ff 5px 10px)}
.sleg{display:flex;justify-content:space-between;font-size:11.5px;margin-top:5px}
.sleg b{font-variant-numeric:tabular-nums}
/* ---------- spell cards ---------- */
.cards{grid-area:cards;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;align-content:start;padding:4px}
@media (min-width:1181px){#app{height:100vh;grid-template-rows:auto minmax(0,1fr)}
 .cards{grid-template-columns:1fr 1fr;gap:9px 10px;overflow:auto;min-height:0;scrollbar-width:thin;grid-auto-rows:min-content}
 #app .card{padding:5px 7px}#app .card .sh,#app .card .pw{display:none}#app .card svg.sig{height:30px}#app .card svg.sp{height:13px}#app .card .am{font-size:14px}#app .card .nm{font-size:12.5px}
 .side{overflow:auto;scrollbar-width:thin}}
.card{position:relative;border-radius:14px;padding:7px 8px 7px;background:linear-gradient(165deg,#fff 0%,color-mix(in srgb,var(--c) 22%,#fff) 60%,color-mix(in srgb,var(--c) 45%,#fff) 100%);
  box-shadow:0 0 0 1.5px #e9bd5d,0 0 0 4px #fff,0 0 0 5px color-mix(in srgb,var(--c) 50%,#fff),0 6px 16px rgba(150,80,140,.18);transition:transform .25s;overflow:hidden;min-width:0}
.card:hover{transform:translateY(-5px) rotate(-1deg)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);transform:translateX(-120%);animation:holo 5s ease-in-out infinite;animation-delay:var(--d);pointer-events:none}
.card .no{font:italic 10px var(--serif);color:color-mix(in srgb,var(--c) 60%,#5a3260);display:flex;justify-content:space-between}
.card svg.sig{display:block;width:100%;height:54px;margin:1px 0}
.card .nm{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:color-mix(in srgb,var(--c) 45%,#3a1d40)}
.card .am{text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.card .sh{text-align:center;font-size:10.5px;color:var(--ink2)}
.card svg.sp{display:block;width:100%;height:18px;margin-top:2px}
.card .pw{text-align:center;font-size:10px;letter-spacing:1px;color:#e2a12d}
@keyframes holo{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sig .rot{transform-origin:50% 50%;transform-box:fill-box;animation:spin 18s linear infinite}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"top" "compact" "side" "cards"}
  .banner{padding:8px 12px}
  .banner .orn{display:none}
}
@media (max-width:460px){
  #app{padding:8px 10px}
  .chibiP{grid-template-columns:120px 1fr}
  #chibi{width:120px;height:140px}
  .stat{min-width:0;padding:3px 9px}.stat b{font-size:14px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <section class="banner">
    <svg class="orn l" viewBox="0 0 52 52"><g fill="none" stroke="#d9a53a" stroke-width="2" stroke-linecap="round"><path d="M44,26 C30,26 26,14 16,12 C8,10 4,18 10,22 C14,25 18,20 15,17"/><path d="M44,26 C30,26 26,38 16,40 C8,42 4,34 10,30 C14,27 18,32 15,35"/></g><path d="M46,26 l4,-4 4,4 -4,4z" fill="#ff8fc0" stroke="#d9a53a"/></svg>
    <svg class="orn r" viewBox="0 0 52 52"><g fill="none" stroke="#d9a53a" stroke-width="2" stroke-linecap="round"><path d="M44,26 C30,26 26,14 16,12 C8,10 4,18 10,22 C14,25 18,20 15,17"/><path d="M44,26 C30,26 26,38 16,40 C8,42 4,34 10,30 C14,27 18,32 15,35"/></g><path d="M46,26 l4,-4 4,4 -4,4z" fill="#ff8fc0" stroke="#d9a53a"/></svg>
    <div class="ttl">
      <div class="k">the Starburn Compact holds <b>✦ TOKKI'S TOKENS ✦</b> <span id="demo">demo data</span></div>
      <div id="total">0</div>
      <div class="u">TOKENS SEALED</div>
    </div>
    <div class="stats">
      <div class="stat t"><small>today</small><b id="sToday">–</b></div>
      <div class="stat"><small>this week</small><b id="sWeek">–</b></div>
      <div class="stat"><small>best day</small><b id="sBest">–</b></div>
    </div>
  </section>

  <section class="compactWrap" id="cw">
    <div class="stageC" id="stageC">
      <svg id="body" viewBox="0 0 500 500"></svg>
      <div class="lidBox" id="lidBox">
        <svg id="lidFront" viewBox="0 0 500 500"></svg>
        <svg id="lidBack" viewBox="0 0 500 500"></svg>
      </div>
      <div id="tipC"></div>
    </div>
  </section>

  <aside class="side">
    <div class="panel chibiP">
      <svg id="chibi" viewBox="0 0 200 230"></svg>
      <div>
        <div class="bubble" id="say">…</div>
        <span class="mood" id="mood">…</span>
        <div class="meter" id="meter"></div>
      </div>
    </div>
    <div class="panel">
      <h2>Heart diary <span>one heart per day · last 16 weeks</span></h2>
      <canvas id="cal"></canvas>
      <div class="calLeg"><span id="calFrom"></span><span>♡ dashed = estimated · fill = tokens</span></div>
    </div>
    <div class="panel">
      <h2>Crystal purity <span>measured vs estimated</span></h2>
      <div class="split"><div class="m" id="sm" style="flex-basis:50%"></div><div class="e" id="se" style="flex-basis:50%"></div></div>
      <div class="sleg"><span>✦ measured <b id="mv">–</b></span><span>✧ estimated <b id="ev">–</b></span></div>
    </div>
  </aside>

  <section class="cards" id="cards"></section>
</div>
<script src="tb-data.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const NS="http://www.w3.org/2000/svg";
const fx=$("fx"), fxx=fx.getContext("2d"); let DPR=Math.min(2,devicePixelRatio||1);
function starPath(cx,cy,ro,ri,n=5,rot=-Math.PI/2){let d="";for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=rot+i*Math.PI/n;d+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1)}return d+"Z"}
const HEART=(s)=>`M0,${14*s} C${-22*s},0 ${-20*s},${-16*s} ${-9*s},${-16*s} C${-4*s},${-16*s} ${-1*s},${-12*s} 0,${-9*s} C${1*s},${-12*s} ${4*s},${-16*s} ${9*s},${-16*s} C${20*s},${-16*s} ${22*s},0 0,${14*s}Z`;

/* ---------------- shared defs ---------------- */
const DEFS=`
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c4"/><stop offset=".45" stop-color="#f2c255"/><stop offset=".7" stop-color="#d0901f"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
 <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#e0a73a"/><stop offset="1" stop-color="#fff0a8"/></linearGradient>
 <radialGradient id="enamel" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff3fa"/><stop offset=".6" stop-color="#ffd3e8"/><stop offset="1" stop-color="#f5a9cf"/></radialGradient>
 <radialGradient id="inner" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f4ecff"/><stop offset="1" stop-color="#dccbff"/></radialGradient>
 <radialGradient id="mirror" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e8e6f6"/><stop offset="1" stop-color="#c9c2e4"/></radialGradient>
 <linearGradient id="mana" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7fb8"/><stop offset=".5" stop-color="#ffb35a"/><stop offset="1" stop-color="#ffe27a"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#b0508f" flood-opacity=".28"/></filter>`;

function filigree(R,n,stroke="#c98d24",w=1.6){
  // gold scrollwork round a ring
  let s="";
  for(let i=0;i<n;i++){
    const a=i/n*360;
    s+=`<g transform="rotate(${a} 250 250) translate(250 ${250-R})">
      <path d="M-14,0 C-14,-8 -4,-10 -2,-4 C0,1 -6,3 -7,-1 M14,0 C14,-8 4,-10 2,-4 C0,1 6,3 7,-1 M-14,0 C-10,6 10,6 14,0" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"/>
      <circle cx="0" cy="-8" r="1.8" fill="#fff6c4" stroke="${stroke}" stroke-width=".8"/></g>`;
  }
  return s;
}
function beads(R,n,r=2.2){let s="";for(let i=0;i<n;i++){const a=i/n*Math.PI*2;s+=`<circle cx="${(250+R*Math.cos(a)).toFixed(1)}" cy="${(250+R*Math.sin(a)).toFixed(1)}" r="${r}" fill="url(#gold)"/>`}return s}

/* ---------------- compact body (open) ---------------- */
const body=$("body");
body.innerHTML=`<defs>${DEFS}<clipPath id="innerClip"><circle cx="250" cy="250" r="212"/></clipPath></defs>
 <g filter="url(#shadow)">
  <circle cx="250" cy="250" r="246" fill="url(#gold)" stroke="#b07a1a" stroke-width="2"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#fff4c0" stroke-width="2" opacity=".8"/>
 </g>
 ${filigree(230,28)}
 <circle cx="250" cy="250" r="214" fill="url(#inner)" stroke="#b07a1a" stroke-width="2"/>
 ${beads(219,64,1.8)}
 <g clip-path="url(#innerClip)">
   <g id="ringRunes" opacity=".55"></g>
 </g>
 <circle cx="250" cy="250" r="128" fill="none" stroke="#e9c06a" stroke-width="1.5" stroke-dasharray="2 5"/>
 <g id="crystals"></g>
 <g id="labels"></g>
 <!-- mana ring -->
 <circle cx="250" cy="250" r="104" fill="url(#enamel)" stroke="url(#gold)" stroke-width="6"/>
 <circle cx="250" cy="250" r="88" fill="none" stroke="#fff" stroke-width="14" opacity=".75"/>
 <circle id="manaArc" cx="250" cy="250" r="88" fill="none" stroke="url(#mana)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 250 250)" filter="url(#glow)" stroke-dasharray="0 999"/>
 <g id="manaHead"><path d="${starPath(0,0,9,3.5,4,0)}" fill="#fff" filter="url(#glow)"/></g>
 ${filigree(76,12,"#e0a73a",1.1).replace(/translate\(250 /g,"translate(250 ")}
 <path d="${HEART(1.15)}" transform="translate(250 200)" fill="#ff8fc0" stroke="#d9a53a" stroke-width="2"/>
 <path d="${starPath(250,198,8,3.5)}" fill="#fff6c4"/>
 <text x="250" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#a0527e" letter-spacing="3">TODAY</text>
 <text id="manaVal" x="250" y="262" text-anchor="middle" font-size="27" font-weight="900" fill="#5a3260">–</text>
 <text id="manaPct" x="250" y="282" text-anchor="middle" font-size="11" fill="#8e6a96">–</text>
 <text id="manaSub" x="250" y="298" text-anchor="middle" font-size="9.5" fill="#a98ab0">of best day</text>
 <!-- hinge -->
 <rect x="214" y="0" width="72" height="16" rx="8" fill="url(#gold)" stroke="#b07a1a" stroke-width="1.5"/>
 <rect x="232" y="3" width="36" height="10" rx="5" fill="#fff4c0" opacity=".7"/>
 <!-- clasp -->
 <path d="${starPath(250,490,18,8)}" fill="url(#gold)" stroke="#b07a1a" stroke-width="1.5"/>
 <circle cx="250" cy="490" r="5" fill="#ff8fc0"/>`;

/* lid front: pink enamel heart, engraved total */
$("lidFront").innerHTML=`<defs>${DEFS}</defs>
 <g filter="url(#shadow)"><circle cx="250" cy="250" r="246" fill="url(#gold)" stroke="#b07a1a" stroke-width="2"/></g>
 ${filigree(230,28)}
 <circle cx="250" cy="250" r="214" fill="url(#enamel)" stroke="#b07a1a" stroke-width="2"/>
 ${beads(219,64,1.8)}
 <g opacity=".55">${Array.from({length:12},(_,i)=>`<path d="M250,250 L${250+200*Math.cos(i/12*Math.PI*2)},${250+200*Math.sin(i/12*Math.PI*2)}" stroke="#fff" stroke-width="1"/>`).join("")}</g>
 <path d="${HEART(7.2)}" transform="translate(250 262)" fill="#ff7fb3" stroke="url(#gold)" stroke-width="9"/>
 <path d="${HEART(6.2)}" transform="translate(250 262)" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
 <path d="${starPath(250,236,58,24)}" fill="url(#gold)" stroke="#b07a1a" stroke-width="2"/>
 <path d="${starPath(250,236,40,17)}" fill="#fff6c4" opacity=".8"/>
 <ellipse cx="190" cy="190" rx="38" ry="16" transform="rotate(-35 190 190)" fill="#fff" opacity=".55"/>
 <text id="lidTotal" x="250" y="402" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" stroke="#c0538c" stroke-width="1">–</text>
 <text x="250" y="422" text-anchor="middle" font-size="11" fill="#fff" letter-spacing="4" font-weight="700">TAP TO OPEN</text>`;
/* lid back: mirror; reflects this week as light streaks */
$("lidBack").innerHTML=`<defs>${DEFS}<clipPath id="mClip"><circle cx="250" cy="250" r="214"/></clipPath></defs>
 <circle cx="250" cy="250" r="246" fill="url(#gold)" stroke="#b07a1a" stroke-width="2"/>
 ${filigree(230,28)}
 <circle cx="250" cy="250" r="214" fill="url(#mirror)" stroke="#b07a1a" stroke-width="2"/>
 <g clip-path="url(#mClip)"><g id="weekStreaks"></g>
  <path d="M90,170 L250,40 L290,40 L120,200Z M140,230 L330,60 L350,72 L160,245Z" fill="#fff" opacity=".7"/></g>`;

/* ---------------- chibi Tokki ---------------- */
const chibi=$("chibi");
chibi.innerHTML=`<defs>
 <linearGradient id="hairC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb886"/><stop offset=".45" stop-color="#ff8fb4"/><stop offset="1" stop-color="#c98bff"/></linearGradient>
 <linearGradient id="irisC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c1866"/><stop offset=".6" stop-color="#b44fd0"/><stop offset="1" stop-color="#ffb3e8"/></linearGradient>
 ${DEFS}</defs>
 <ellipse cx="100" cy="222" rx="44" ry="6" fill="#d9a0c8" opacity=".35" id="cShadow"/>
 <g id="cAll">

  lidBox.style.transform=`rotateX(${ang.toFixed(2)}deg)`;
  // crystals fill (only once open)
  const I=D.intensity||0;
  for(const c of crystals){
    c.cur+= ((open>.6?c.f:0)-c.cur)*Math.min(1,dt*1.8);
    const top=c.b-c.L*c.cur, W=c.W; let d=`M${250-W},${c.b+2} L${250-W},${top}`;
    for(let k=0;k<=8;k++){const xx=250-W+k*W/4; d+=` L${xx.toFixed(1)},${(top+Math.sin(time*3+k*.9+c.a)*1.6).toFixed(1)}`}
    d+=` L${250+W},${c.b+2}Z`; c.liq.setAttribute("d",d);
  }
  // mana ring = today / best day
  manaShown+=((open>.5?charge:0)-manaShown)*Math.min(1,dt*1.5);
  const C=2*Math.PI*88, L=Math.max(.001,manaShown)*C;
  manaArc.setAttribute("stroke-dasharray",`${L.toFixed(1)} ${C}`);
  const ha=-Math.PI/2+manaShown*Math.PI*2; manaHead.setAttribute("transform",`translate(${(250+88*Math.cos(ha)).toFixed(1)} ${(250+88*Math.sin(ha)).toFixed(1)}) rotate(${(time*90)%360}) scale(${1+.25*Math.sin(time*6)})`);
  $("manaPct").textContent=Math.round(manaShown*100)+"%";
  // chibi
  const bounce = mood==="excited"? Math.abs(Math.sin(time*5))*-12 : mood==="happy"? Math.abs(Math.sin(time*3))*-5 : mood==="calm"? Math.sin(time*1.6)*1.5 : 0;
  const tilt = mood==="sleepy"? Math.sin(time*.8)*6+6 : Math.sin(time*2)*2;
  cAll.setAttribute("transform",`translate(0 ${bounce.toFixed(2)})`);
  cShadow.setAttribute("rx",(44+bounce*1.2).toFixed(1));
  cHead.setAttribute("transform",`rotate(${tilt.toFixed(2)} 100 140)`);
  const sw=mood==="excited"?14:mood==="happy"?7:3; cTailL.setAttribute("transform",`rotate(${(Math.sin(time*3)*sw*.4).toFixed(2)} 60 70)`); cTailR.setAttribute("transform",`rotate(${(-Math.sin(time*3)*sw*.4).toFixed(2)} 140 70)`);
  const wave= mood==="sleepy"? 20 : mood==="calm"? -10+Math.sin(time*1.5)*6 : -60+Math.sin(time*(mood==="excited"?9:5))*25;
  cArmR.setAttribute("transform",`rotate(${wave.toFixed(1)} 116 154)`);
  cWand.setAttribute("transform",`translate(138 172) rotate(${(mood==="excited"?time*400%360:0).toFixed(0)})`);
  if(mood==="sleepy"){cZ.setAttribute("transform",`translate(${Math.sin(time)*3} ${-((time*8)%14)})`);cZ.setAttribute("opacity",(1-((time*8)%14)/14*.6).toFixed(2))}
  if((mood==="calm"||mood==="happy")&&time>blink){const bt=time-blink;eyesOpen.setAttribute("transform",`translate(0 106) scale(1 ${bt<.08?1-bt/.08*.9:bt<.16?.1+(bt-.08)/.08*.9:1}) translate(0 -106)`);if(bt>.16)blink=time+2+Math.random()*3}
  // particles: rate follows today's intensity
  const rate= mood==="sleepy"?1.5: 2+40*I*I*(mood==="excited"?1.6:1);
  acc+=dt*rate;
  while(acc>1){acc--; add(Math.random()*innerWidth,innerHeight+10,{vx:(Math.random()-.5)*20,vy:-30-Math.random()*50,max:6+Math.random()*6,c:pick()})}
  if(mood==="excited"&&Math.random()<.25){const r=chibi.getBoundingClientRect();add(r.left+r.width*(.3+Math.random()*.4),r.top+r.height*.4,{vx:(Math.random()-.5)*120,vy:-60-Math.random()*80,max:1,c:pick(),s:3+Math.random()*3,k:"s",g:120})}
  fxx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;if(p.life>p.max){P.splice(i,1);continue}
    p.vy+=(p.g||0)*dt; p.x+=p.vx*dt+Math.sin(time*2+p.rot)*.3; p.y+=p.vy*dt; p.rot+=dt;
    const k=p.life/p.max, al=k<.1?k/.1:1-Math.max(0,(k-.6)/.4);
    fxx.save(); fxx.globalAlpha=al*.85; fxx.translate(p.x,p.y); fxx.fillStyle=p.c;
    if(p.k==="h"){fxx.scale(p.s/3.5,p.s/3.5);fxx.rotate(Math.sin(p.rot)*.3);fxx.fill(heartP)} else {fxx.rotate(p.rot);star4(fxx,p.s)}
    fxx.restore();}
}
size(); requestAnimationFrame(frame);
setTimeout(size,50);
})();
</script>
